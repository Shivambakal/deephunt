  - object_identifier
  - endpoint_inventory
  required_state: []
  hypothesis_generator: Where IDOR via parameter pollution / duplicate params is denied on reads but Excessive data exposure
    / mass assignment allows extra fields on writes, bind ownership fields on update and re-test readability as the new owner.
  request_strategy: 'staged multi-step combo: establish each parent primitive, then execute the fused sequence'
  mutation_strategy: cross-primitive mutation — vary the interaction point, not each parent in isolation
  expected_signal: ownership_transfer_via_mass_assignment; owner_id_binding
  positive_oracle: 'COMBO-IDOR-MASS-HELD: on an update endpoint that correctly denies cross-account reads (IDOR via parameter
    pollution / duplicate params negative), submit the update with mass-assigned ownership fields (owner_id, user_id, account_id
    variants from Excessive data exposure / mass assignment). The oracle holds when the object is thereafter readable/writable
    by the attacker as its new owner — ownership transferred through a field the update endpoint never should have bound.'
