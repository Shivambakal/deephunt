    accepted as a signing key: alg confusion, none-alg, or weak-secret re-sign), then invoke the privileged server-side function
    that Role/plan restriction enforced client-side only showed was only hidden client-side. The oracle holds when the server
    executes the privileged action for the forged elevated claim — proving role enforcement is absent server-side, not merely
    hidden.'
