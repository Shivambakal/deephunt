  request_strategy: 'staged multi-step combo: establish each parent primitive, then execute the fused sequence'
  mutation_strategy: cross-primitive mutation — vary the interaction point, not each parent in isolation
  expected_signal: rollback_residue_usable; side_effect_survives_rollback
  positive_oracle: 'COMBO-LOGIC-ROLLBACK-HELD: drive a multi-step business flow (Coupon/promo stacking and reuse abuse) to
    the point where a side effect is emitted, then force the rollback path (payment failure, validation error, delete-after-use
    per Feedback pruning and use-after-delete checkers). The oracle holds when the rolled-back flow leaves a residue that
    remains usable — an un-revoked credit, a still-valid token, a consumable voucher — proving the rollback is not atomic
    across all side effects.'
