  - verify parent primitives independently first — a combo built on a failed parent is noise
  followup_experiment: enumerate bindable fields via error messages; test nested objects (user[id]); confirm persistence across
    sessions
  regression_test: replay control/test pair; expect combined oracle HELD
  difficulty_estimate: 0.8
  forged_from:
  - IDOR-02
  - API-01
  forge_rule: R-IDOR-MASS
  why_non_obvious: 'IDOR testing asks ''can I read someone else''s object''; mass-assignment testing asks ''can I set fields
    I shouldn''t''. The fusion asks the nastier question: can I mass-assign owner_id/user_id on an update endpoint that PASSED
    the direct IDOR test, silently transferring ownership to myself?'
