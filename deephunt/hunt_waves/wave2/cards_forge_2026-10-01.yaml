  regression_test: replay control/test pair; expect combined oracle HELD
  difficulty_estimate: 1.0
  forged_from:
  - BLO-02
  - SEQ-03
  forge_rule: R-LOGIC-ROLLBACK
  why_non_obvious: Business-logic tests check the happy path and the tampered path; rollback is assumed to restore the world.
