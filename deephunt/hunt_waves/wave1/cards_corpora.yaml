      - "Does the back-end wait for bytes the front-end already consumed (or vice versa)?"
    evidence:
      - "Repeatable response delay on the desync probe versus a clean control request"
    followups:
      - C1-017
      - C1-019
    test: "Send the classic timing probes on a single connection: CL.TE — POST with both Content-Length: 4 and Transfer-Encoding: chunked and a short chunked body; if the front-end honors CL and the back-end honors TE, the back-end waits and the response is delayed. TE.CL — swap the lengths (CL: 6) so the back-end waits for CL bytes. Run each at least 3 times plus clean controls; only a repeatable delta counts."
    impact_hint: "Request smuggling: cache poisoning, credential capture, front-end control bypass."
    preconditions:
      - "HTTP/1.1 hop between front-end and back-end"
      - "Scope permits desync probing (timing only, no poisoning)"
    required_state: "unauthenticated"
    hypothesis_generator: "Ambiguous framing (both CL and TE present) is resolved differently per hop; the disagreement shows as a timing delta."
    request_strategy: "Timing probes only; never poison shared state; disable connection reuse when validating."
    mutation_strategy: "Try CL.TE then TE.CL; adjust lengths if the stack normalizes one header."
    expected_signal: "Consistent delay (seconds) on desync probes, fast responses on controls."
    positive_oracle: "Delay reproduced >=3 times on the probe and absent on the control."
    negative_evidence:
      - "No timing delta across runs"
      - "Stack rejects ambiguous requests outright (400)"
    false_positive_rules:
      - "A single slow response is noise — require repeats and controls"
      - "Disable pipelining/keep-alive reuse during validation; connection reuse alone can fake desync"
    followup_experiment: "If desync confirmed, validate with a self-poison (your own follow-up request) before any impact claim; then try TE obfuscation (C1-017)."
    regression_test: "Clean control requests stay fast; probe timing delta persists."
    difficulty_estimate: 4

