      - "GraphQL validation errors are not injection — require a backend-shaped signal"
      - "Do not extract data beyond proving the differential"
    followup_experiment: "If a differential exists, characterize boolean vs error-based to scope impact."
    regression_test: "Benign filter returns the normal result set."
    difficulty_estimate: 3

  - id: C1-026
    name: "GraphQL JSON array batching to bypass single-query rate limits"
    klass: graphql
    requires:
      - graphql_endpoint
    signals:
      - rate_limit_on_login_or_otp_field
      - batching_not_documented
    questions:
      - "Does the endpoint accept a JSON array of queries as one HTTP request?"
      - "Is the rate limit applied per HTTP request rather than per GraphQL operation?"
    evidence:
      - "N operations in one array all execute while N sequential requests are throttled"
    followups:
      - C1-008
    test: "Send the login/OTP-guess operation as a JSON array of 10 aliased copies in a single POST ([{query: ...}, ...]). If all 10 execute (check per-operation responses) while 10 sequential single requests hit the rate limit, the limit counts HTTP requests, not operations — batching multiplies the effective attempt rate."
    impact_hint: "Credential stuffing / OTP brute-force at N× the intended rate."
    preconditions:
      - "GraphQL endpoint with a rate-limited sensitive operation"
    required_state: "unauthenticated"
    hypothesis_generator: "Array batching packs many operations into one HTTP request; naive rate limiters count the request once."
    request_strategy: "Small batches (10) against your own test account; never brute-force real users."
    mutation_strategy: "Vary batch size; try aliases vs array batching."
    expected_signal: "Batched operations all return operation-level responses without throttle errors."
    positive_oracle: "10 batched attempts succeed where 10 sequential singles are throttled."
    negative_evidence:
      - "Array batching rejected or each operation still counted"
      - "Batch size capped at 1"
    false_positive_rules:
      - "Only test with your own account's credentials/OTP space"
      - "A successful batch is the finding; do not run real brute-force campaigns"
    followup_experiment: "Check whether persisted-query or GET-based queries offer the same multiplication."
    regression_test: "Single requests still rate-limited as before."
    difficulty_estimate: 3

  - id: C1-027
    name: "GraphQL deep/circular nesting to evade depth limits (resource exhaustion)"
    klass: graphql
    requires:
      - graphql_endpoint
    signals:
      - self_referential_types
      - no_or_weak_query_complexity_limit
    questions:
      - "Do interfaces, fragments, or aliases let a query exceed the advertised depth limit?"
      - "Is cost calculated on the query string rather than the expanded execution plan?"
    evidence:
      - "Deeply nested query executes despite a depth limit, with high response time"
    followups:
      - C1-026
    test: "Build a nested query through a self-referential field (user { friends { friends { ... } } }) and, if a depth limit blocks it, re-express the nesting with fragments and aliases or via interface types that the depth counter measures differently. Measure response time versus a shallow control; a large, repeatable slowdown with successful execution indicates weak complexity analysis."
    impact_hint: "Denial of service via expensive queries; often out of scope — check program rules first."
    preconditions:
      - "GraphQL schema with recursive relationships; DoS testing in scope"
    required_state: "authenticated_if_required"
    hypothesis_generator: "Depth/complexity guards that count syntax instead of execution cost can be evaded with fragments and aliases, allowing exponential field expansion."
    request_strategy: "Modest depths first; stop at clear signal — never attempt actual DoS."
    mutation_strategy: "Fragments, aliases, and interface spreads as alternative nesting spellings."
    expected_signal: "Nested query executes (not rejected) with disproportionate latency."
    positive_oracle: "Execution success plus latency far above the shallow control, reproducible."
    negative_evidence:
      - "Depth/complexity limit rejects all deep shapes"
      - "Query cost analysis blocks expansion regardless of spelling"
    false_positive_rules:
      - "DoS findings need program permission; otherwise report as missing complexity controls with the timing evidence"
      - "One slow query is noise — require repeats and a control"
    followup_experiment: "If evasion works, test whether persisted queries bypass the analysis entirely."
    regression_test: "Shallow queries unaffected; deep shape behavior stable."
    difficulty_estimate: 4

  - id: C1-028
    name: "Open-redirect fragment smuggling past path-only validators"
    klass: web
    requires:
      - redirect_parameter
    signals:
      - validator_inspects_path_only
      - redirect_built_from_raw_input
    questions:
      - "Does the validator parse the URL and check only .Path, ignoring .Fragment?"
      - "Is the Location header built from the original unsanitized string?"
    evidence:
      - "302 Location points at the attacker host smuggled after #"
    followups:
      - C1-008
      - C1-029
    test: "Submit redirectTo=/%23/../attacker.example/ (i.e., path '/' with fragment '/..//attacker.example/'): a validator that checks only the parsed path sees '/' and approves, but if the response Location is built from the raw string, the fragment survives and the browser follows it to the attacker host. Verify the actual 302 Location value."
    impact_hint: "Open redirect; chained into OAuth code theft or phishing."
    preconditions:
      - "Redirect target taken from user input with a parse-then-check validator"
    required_state: "unauthenticated"
    hypothesis_generator: "Parsing discards the fragment for validation, but emitting the raw string reintroduces it into the redirect — a check/emit mismatch."
    request_strategy: "A few fragment-smuggling shapes; read raw 302 Location headers."
    mutation_strategy: "Vary fragment content (//attacker, /\\attacker, encoded # as %23 vs literal)."
    expected_signal: "Location header contains the attacker host."
    positive_oracle: "302 Location resolves to the attacker-controlled host."
    negative_evidence:
      - "Fragment stripped from the emitted Location"
      - "Validator rejects or normalizes the whole input"
    false_positive_rules:
      - "The Location header is the oracle — not the request URL echo"
      - "Confirm the browser actually follows it (some clients drop fragments on redirect)"
    followup_experiment: "Chain the redirect into an OAuth redirect_uri bypass (C1-008)."
    regression_test: "Legitimate relative redirects still work."
    difficulty_estimate: 3

  - id: C1-029
    name: "DOM open redirect via validate-decoded / emit-original mismatch"
    klass: web
    requires:
      - spa_redirect_helper
    signals:
      - client_side_redirect_from_param
      - double_encoding_accepted
    questions:
      - "Does the SPA decode the path for validation but navigate to the original string?"
      - "Do encoded ../ segments survive validation and decode later in the browser?"
    evidence:
      - "Double-encoded traversal navigates the SPA to an unintended route/gadget"
    followups:
      - C1-028
    test: "Send a path like /dashboard/script/%253f%2f..%2f..%2fuser%2frotate%3fredirectTo%3d... where the validator decodes once (seeing no '..') but the app later uses the original string, which the browser decodes a second time into a traversal. Observe the final navigated URL or fetched resource — if it reaches the unintended endpoint, the decode/emit mismatch is confirmed."
    impact_hint: "Client-side path traversal; chained with a redirect gadget it becomes XSS/account takeover."
    preconditions:
      - "SPA redirect/loader helper that validates a decoded copy but acts on the raw string"
    required_state: "unauthenticated"
    hypothesis_generator: "Double decoding — once by the validator, once by the browser — lets encoded traversal survive the check and execute on navigation."
    request_strategy: "A few double-encoded shapes; observe navigation/fetch targets."
    mutation_strategy: "Vary encoding depth (%2f vs %252f) and traversal depth."
    expected_signal: "App navigates to or fetches the traversed endpoint."
    positive_oracle: "Network log shows a request to the unintended route with your marker."
    negative_evidence:
      - "Validator normalizes before both check and use"
      - "Traversal blocked at every encoding depth"
    false_positive_rules:
      - "The fetched/navigated URL is the oracle, not the input echo"
      - "Do not chain to actual script execution on a live target beyond the navigation proof"
    followup_experiment: "If traversal reaches a redirect gadget, test the fragment-smuggling chain (C1-028)."
    regression_test: "Normal SPA navigation unaffected."
    difficulty_estimate: 4

  - id: C1-030
    name: "Mass assignment via nested objects and array role fields"
    klass: api
    requires:
      - json_update_or_register_endpoint
    signals:
      - extra_fields_silently_accepted
      - orm_auto_binding
    questions:
      - "Does the endpoint bind nested JSON (user: {role: ...}) or arrays (role_ids: [1,2])?"
      - "Is there a server-side allowlist of bindable fields?"
    evidence:
      - "Injected role/isAdmin/balance field persists and is reflected in subsequent reads"
    followups:
      - C1-014
    test: "On register/profile-update, add guarded fields at multiple shapes: flat ({\"role\": \"admin\", \"isAdmin\": true}), nested ({\"user\": {\"role\": \"admin\"}}), and array ({\"role_ids\": [1]}). Then read the object back: if any guarded field persisted, binding is not allowlisted. Use only your own test account."
    impact_hint: "Privilege escalation, balance/price manipulation."
    preconditions:
      - "JSON body bound to a model/ORM without an explicit field allowlist"
    required_state: "authenticated_as_test_user"
    hypothesis_generator: "Auto-binding frameworks assign every supplied key; nested and array shapes bypass flat blocklists."
    request_strategy: "One shape per request against your own account; read back each time."
    mutation_strategy: "Flat, nested, array, and case-variant field names."
    expected_signal: "Guarded field present in the read-back response."
    positive_oracle: "Subsequent GET shows the injected privileged value on your test account."
    negative_evidence:
      - "Extra fields ignored or rejected on all shapes"
      - "Explicit allowlist in the binding code"
    false_positive_rules:
      - "Persistence plus read-back is required — an echoed request body is not a finding"
      - "Never escalate your own account beyond the test; revert after confirming"
    followup_experiment: "Test whether the same shapes work on admin-only endpoints (BFLA)."
    regression_test: "Normal update without extra fields behaves as before."
    difficulty_estimate: 2

  - id: C1-031
    name: "Blind XXE exfiltration via out-of-band parameter entities"
    klass: injection
    requires:
      - xml_parsing_endpoint
      - no_inline_entity_reflection
    signals:
      - external_dtd_fetched
      - error_or_timing_on_doctype
    questions:
      - "Are external parameter entities resolved even when inline entities are blocked?"
      - "Does the parser make an outbound request for the external DTD?"
    evidence:
      - "Collaborator receives a hit for the external DTD URL (blind XXE confirmed)"
      - "File content exfiltrated via parameter-entity error or second request"
    followups:
      - C1-024
    test: "Submit XML with a DOCTYPE declaring an external parameter entity pointing at your collaborator (<!ENTITY % xxe SYSTEM \"https://<collab>/xxe\"> %xxe;). A collaborator hit proves the parser resolves external entities — blind XXE — without needing inline reflection. Do not exfiltrate real files; the callback is the finding."
    impact_hint: "File disclosure, SSRF via the parser, and with expect:// wrappers, RCE on some stacks."
    preconditions:
      - "Server-side XML parsing (uploads, SVG, DOCX/XLSX, SOAP, SAML)"
    required_state: "authenticated_if_required_by_feature"
    hypothesis_generator: "Disabling inline entity expansion often leaves parameter-entity external resolution enabled; the outbound DTD fetch is observable blind."
    request_strategy: "Single DTD probe with a unique collaborator URL."
    mutation_strategy: "Try SYSTEM then PUBLIC identifiers; try SVG wrapper if plain XML is rejected."
    expected_signal: "Outbound request to the collaborator URL."
    positive_oracle: "Collaborator log shows the DTD fetch from the target's infrastructure."
    negative_evidence:
      - "No outbound request; DOCTYPE rejected outright"
      - "External entities fully disabled"
    false_positive_rules:
      - "The callback must come from the target's parser, keyed to your unique URL"
      - "Do not attempt file exfiltration on a live target — the fetch proof suffices"
    followup_experiment: "If blind XXE confirmed, assess in an authorized lab whether error-based exfiltration is possible."
    regression_test: "Benign XML without DOCTYPE processes normally."
    difficulty_estimate: 3

  - id: C1-032
    name: "403/401 bypass via X-Original-URL / X-Rewrite-URL route override"
    klass: auth
    requires:
      - forbidden_admin_or_internal_path
    signals:
      - reverse_proxy_or_waf_in_front
      - framework_honors_override_headers
    questions:
      - "Does the back-end route on X-Original-URL while the front-end ACLs the visible path?"
      - "Do verb or path mutations change the decision?"
    evidence:
      - "403 becomes 200 with protected content when the override header rewrites the path"
    followups:
      - C1-009
    test: "Request a benign allowed path (/) with X-Original-URL: /admin (and variants X-Rewrite-URL, X-Forwarded-Path). If the back-end honors the header for routing while the front-end ACL saw only '/', a 403 flips to 200 with admin content. Baseline the 403 first, and require a protected-content marker — not just a status change — as proof."
    impact_hint: "Authorization bypass to admin/internal functionality."
    preconditions:
      - "Front-end ACL and back-end routing disagree on which value to trust"
    required_state: "authenticated_low_privilege"
    hypothesis_generator: "Some stacks route on override headers for rewrites; if the ACL checks the original path, the header smuggles the real destination past it."
    request_strategy: "A few header variants against the known-403 path; compare bodies."
    mutation_strategy: "Cycle X-Original-URL, X-Rewrite-URL, X-Forwarded-Path; try with different verbs."
    expected_signal: "Status flips 403->200 and the body contains admin-only markers."
    positive_oracle: "Response body contains content only an authorized admin view would render."
    negative_evidence:
      - "Override headers ignored; 403 persists on all variants"
      - "200 but body is the generic error page"
    false_positive_rules:
      - "Require the protected-content marker — soft-200 error pages are the classic false positive"
      - "Diff against the authenticated-admin view if you have one; otherwise against the 403 baseline"
    followup_experiment: "If routing honors the header, test path-traversal and verb-tampering combinations."
    regression_test: "Direct /admin request still 403s; benign path unaffected."
    difficulty_estimate: 2
