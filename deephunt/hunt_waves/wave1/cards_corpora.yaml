# DEEPHUNT Wave 1 — Worker 3: Books & Corpora Miner
# Technique cards mined from public offensive-security corpora (read-only research).
# Sources: OWASP Testing Guide v4.2 (WSTG), OWASP API Top 10 2023, OWASP Top 10:2025,
# HackTricks (hacktricks.wiki / book.hacktricks.xyz mirror), PayloadsAllTheThings,
# SecLists, PortSwigger Academy methodology, "Hacking APIs" (Corey Ball, No Starch).
# All wording is original; source URLs are cited, text is never copied.
# Each card is a BYPASS PRIMITIVE: what filter/assumption it defeats, why the
# defeat works, and how to confirm without false positives.
# Genuinely distinct from existing cards (web.yaml SSRF-02/03, SMUG-02/03/04,
# GQL-01..07, JWT-01/02, CACHE-01/02/03, REDIR OAuth chains, XXE-01, SSTI-01).
techniques:
  - id: C1-001
    name: "SSRF filter bypass via IP-format polymorphism"
    klass: ssrf
    requires:
      - url_input_parameter
    signals:
      - fetch_parameter_accepts_arbitrary_host
      - filter_blocks_dotted_decimal_private_ips
    questions:
      - "Does the filter validate the literal string instead of the resolved address?"
      - "Does the URL parser normalize alternate IP notations before the allowlist check?"
    evidence:
      - "Fetch of an alternate-encoding internal address returns internal content or distinct timing"
      - "OOB callback received at collaborator for the polymorphic URL"
    followups:
      - C1-002
      - C1-003
      - C1-004
    test: "Replace a blocked 127.0.0.1 / 169.254.169.254 with equivalent encodings: decimal (http://2130706433/), octal (http://0177.0.0.1/), hex (http://0x7f.0.0.1/ or mixed 0x7f.0.0.1), IPv6 loopback (http://[::1]/), IPv4-mapped IPv6 (http://[::ffff:127.0.0.1]/), and shortened forms (http://127.1/, http://0x7f.1/). Submit each as the fetch parameter value."
    impact_hint: "SSRF to loopback/internal services; escalation path to cloud metadata or internal admin APIs."
    preconditions:
      - "A server-side fetch of a user-controlled URL exists"
      - "A naive filter blocks dotted-decimal private ranges or the literal 127.0.0.1"
    required_state: "unauthenticated"
    hypothesis_generator: "If the filter matches the URL string rather than the socket address, alternate numeric encodings of the same IP will pass the filter and still resolve to the internal host."
    request_strategy: "Single GET/POST per encoding, low rate; keep total probes small and sequential."
    mutation_strategy: "Permute IP encodings one axis at a time (decimal, octal, hex, IPv6, shortened) against the same endpoint."
    expected_signal: "Response body/timing for the encoded URL differs from the blocked baseline (blocked = error/reject page), matching an internal fetch signature."
    positive_oracle: "Collaborator/OOB nonce returned for the encoded URL, or internal-content marker (e.g., metadata-shaped JSON, service banner) in the response."
    negative_evidence:
      - "All encodings rejected with the same filter error as the literal IP"
      - "No OOB callback and response identical to a public-control URL"
    false_positive_rules:
      - "Never claim on a reflected echo of the URL — require a response-shaped token the target alone could produce"
      - "Timeout alone is not confirmation; closed ports answer fast, filtered hosts hang — compare against a known-closed-port baseline"
    followup_experiment: "Once an encoding passes, escalate to metadata endpoints (C1-003) and redirect chains (C1-004) using the passing encoding."
    regression_test: "Re-run the literal blocked IP and one passing encoding; blocked must stay blocked, passing must stay passing."
    difficulty_estimate: 2

  - id: C1-002
    name: "SSRF allowlist bypass via DNS rebinding TOCTOU"
    klass: ssrf
    requires:
      - url_input_parameter
      - owned_dns_record
    signals:
      - filter_validates_hostname_at_request_time
      - dns_lookup_happens_at_connect_time
    questions:
      - "Is the allowlist applied to the DNS name rather than the resolved IP?"
      - "Is there a window between the check and the connection where DNS can change?"
    evidence:
      - "OOB hit from an internal source IP shortly after the DNS record flips to internal"
      - "Internal content returned when the resolver was just flipped"
    followups:
      - C1-003
    test: "Point the fetch parameter at a domain you control with a very low TTL. Serve the public IP first (passes the allowlist), then flip the record to 127.0.0.1 or 169.254.169.254 and re-send the request quickly. Use distinct OOB nonces per attempt so a hit proves the flipped resolution was used."
    impact_hint: "Full SSRF despite a correct-looking hostname allowlist; same escalation as classic SSRF."
    preconditions:
      - "The server resolves the hostname itself at connect time"
      - "You control an authoritative DNS name with low TTL, or a rebinding service"
    required_state: "unauthenticated"
    hypothesis_generator: "If validation happens on the hostname string at request time but resolution happens later at connect time, a DNS flip between the two defeats the allowlist."
    request_strategy: "Two-phase: warm the allowlist with the benign resolution, then flip and fire; a handful of attempts, watch collaborator."
    mutation_strategy: "Vary TTL and flip timing; try flipping to loopback first, then to metadata IP."
    expected_signal: "OOB callback keyed to a nonce sent only in the flipped-resolution request."
    positive_oracle: "Collaborator log shows a hit with the flipped nonce, or internal-content marker in the response."
    negative_evidence:
      - "No OOB hit across multiple flip timings"
      - "Server appears to resolve once and cache (second request reuses first resolution)"
    false_positive_rules:
      - "A hit before the flip only proves benign resolution — the nonce must be unique to the flipped attempt"
      - "Do not hammer; repeated flips against a shared resolver can look like abuse"
    followup_experiment: "If rebinding works, chain to metadata credential theft (C1-003) with the flipped record pointing at 169.254.169.254."
    regression_test: "Reset DNS to benign, confirm the request is allowed again and no internal hit occurs."
    difficulty_estimate: 4

  - id: C1-003
    name: "Cloud metadata SSRF via header-requirement primitives"
    klass: cloud
    requires:
      - ssrf_primitive_confirmed
    signals:
      - fetch_of_metadata_ip_returns_403_or_empty
      - target_runs_on_aws_gcp_or_azure
    questions:
      - "Does the metadata endpoint require a special header the SSRF primitive can inject?"
      - "Is IMDSv2 in force (needs a PUT token hop) or is IMDSv1 reachable?"
    evidence:
      - "Metadata-shaped JSON (instance-id, ami-id, AccessKeyId) in the SSRF response"
      - "Task-role credentials JSON from the ECS endpoint 169.254.170.2"
    followups:
      - C1-004
    test: "After confirming SSRF, try each provider's required handshake: AWS IMDSv1 GET /latest/meta-data/iam/security-credentials/; if 401, attempt the IMDSv2 two-hop (PUT /latest/api/token with X-aws-ec2-metadata-token-ttl-seconds) only if the primitive allows method/header control. GCP: /computeMetadata/v1/ with Metadata-Flavor: Google. Azure: /metadata/instance?api-version=2021-02-01 with Metadata: true. ECS tasks: http://169.254.170.2/v2/credentials/<guid>."
    impact_hint: "Cloud credential theft; pivot to IAM, storage, queues."
    preconditions:
      - "SSRF primitive confirmed (any encoding)"
      - "Program scope explicitly permits metadata testing; otherwise use an owned collaborator URL"
    required_state: "unauthenticated"
    hypothesis_generator: "Metadata endpoints reject plain GETs without their required headers; the SSRF primitive only yields credentials if the fetcher can be made to send those headers or reach the headerless variants."
    request_strategy: "Probe each provider endpoint once; stop at the first that returns metadata-shaped data."
    mutation_strategy: "Rotate provider endpoints; if headers cannot be injected, fall back to headerless paths (IMDSv1, ECS task endpoint)."
    expected_signal: "JSON containing AccessKeyId / role credentials / instance identity in the SSRF response body."
    positive_oracle: "Parseable credentials JSON embedded in the response (extract and HTML-unescape before parsing)."
    negative_evidence:
      - "403/401 on all provider endpoints with no metadata-shaped body"
      - "No header-injection vector exists to satisfy the required headers"
    false_positive_rules:
      - "A reflected URL string is not metadata — require JSON structure with provider keys"
      - "Never exfiltrate or use real cloud credentials; report the read and stop"
    followup_experiment: "If IMDSv2 blocks the token hop, look for a second SSRF primitive that allows header/method control."
    regression_test: "Re-request a benign metadata path; confirm the 403/empty baseline is unchanged."
    difficulty_estimate: 3

  - id: C1-004
    name: "SSRF allowlist bypass via attacker-controlled redirect chain"
    klass: ssrf
    requires:
      - url_input_parameter
      - owned_http_server
    signals:
      - allowlist_accepts_attacker_domain
      - server_follows_redirects_on_fetch
    questions:
      - "Is the allowlist applied to the initial URL but not to redirect targets?"
      - "How many redirect hops does the fetcher follow?"
    evidence:
      - "OOB hit on the internal target after the redirect, or internal content in the final response"
    followups:
      - C1-003
    test: "Host a URL on your domain that returns HTTP 302 to the internal target (e.g., http://169.254.169.254/latest/meta-data/). Submit your URL as the fetch parameter. The allowlist sees only your domain; the fetcher follows the redirect to the internal address. Use a unique nonce path per attempt."
    impact_hint: "Defeats domain allowlists entirely; same escalation as direct SSRF."
    preconditions:
      - "The fetcher follows HTTP redirects"
      - "Your domain passes the allowlist"
    required_state: "unauthenticated"
    hypothesis_generator: "If validation runs once on the submitted URL and redirects are followed without re-validation, an attacker 302 converts an allowed URL into an internal fetch."
    request_strategy: "One redirect URL per internal target; low volume."
    mutation_strategy: "Try 301/302/307/308 and meta-refresh; try redirecting to a second attacker URL that then redirects internal (multi-hop)."
    expected_signal: "Internal content or OOB hit keyed to the redirect nonce."
    positive_oracle: "Collaborator hit from the redirect chain, or metadata-shaped content in the final response."
    negative_evidence:
      - "Fetcher returns the 302 body instead of following it"
      - "Fetcher re-validates the redirect target against the allowlist"
    false_positive_rules:
      - "Confirm the hop actually happened — a 302 echo in the response is not a followed redirect"
      - "Nonce must be unique per attempt"
    followup_experiment: "Chain the passing redirect into metadata endpoints (C1-003)."
    regression_test: "Point the redirect back to a benign page; confirm normal fetch behavior."
    difficulty_estimate: 2

  - id: C1-005
    name: "JWT kid SQL injection for key confusion"
    klass: auth
    requires:
      - jwt_with_kid_header
    signals:
      - kid_header_present_in_token
      - distinct_error_or_timing_on_kid_mutation
    questions:
      - "Is the kid value interpolated into a key-lookup SQL query?"
      - "Can a UNION SELECT return an attacker-chosen string as the HMAC key?"
    evidence:
      - "Token signed with the injected key value is accepted for an escalated claim set"
    followups:
      - C1-006
      - C1-007
    test: "Take a captured JWT, set the kid header to a SQL injection that returns a known string as the key (e.g., kid: nonexistent' UNION SELECT 'attackerkey' -- ), re-sign the payload with HS256 using 'attackerkey' as the secret, and submit. If accepted with modified claims, the kid feeds a SQL query."
    impact_hint: "Full JWT forgery; impersonate any user, escalate to admin."
    preconditions:
      - "Token carries a kid header claim"
      - "Backend looks up the verification key by kid"
    required_state: "authenticated_low_privilege"
    hypothesis_generator: "If kid is concatenated into a SQL key lookup, injecting a UNION that returns a known constant makes that constant the HMAC secret, letting us mint arbitrary tokens."
    request_strategy: "Single crafted token per attempt; try a few UNION shapes before concluding."
    mutation_strategy: "Vary the UNION payload (comment styles, quote balance) to fit the backend's query shape."
    expected_signal: "Server accepts the re-signed token with attacker-modified claims (role/admin/sub changed)."
    positive_oracle: "Authenticated response reflects the forged identity (e.g., admin panel reachable, user id changed)."
    negative_evidence:
      - "Token rejected regardless of kid content"
      - "kid appears to select from a fixed key set (only known kids accepted)"
    false_positive_rules:
      - "Acceptance must be tied to the forged claims, not a generic 200 on a public endpoint"
      - "Do not mistake signature-not-verified bugs for kid SQLi — first confirm tampered payload without valid signature is rejected"
    followup_experiment: "If SQLi fails, try kid path traversal (C1-006) and jku/x5u spoofing (C1-007)."
    regression_test: "Submit the original unmodified token; it must still validate."
    difficulty_estimate: 4

  - id: C1-006
    name: "JWT kid path traversal to attacker-known key material"
    klass: auth
    requires:
      - jwt_with_kid_header
    signals:
      - kid_header_present_in_token
      - kid_looks_like_filename_or_path
    questions:
      - "Is the kid treated as a file path to the verification key?"
      - "Which files with known content are readable by the process?"
    evidence:
      - "Token signed with the known file content (e.g., empty string, '2') is accepted"
    followups:
      - C1-005
      - C1-007
    test: "Set kid to a traversal reaching a file with known content — ../../../../dev/null (empty key, sign with empty secret) or ../../proc/sys/kernel/randomize_va_space (content '2', sign with '2'). Re-sign the JWT with HS256 using that content as the secret and submit with escalated claims."
    impact_hint: "Full JWT forgery without any key discovery."
    preconditions:
      - "kid is used as a filesystem path for key loading"
      - "At least one readable file with predictable content exists"
    required_state: "authenticated_low_privilege"
    hypothesis_generator: "If kid becomes a file path, pointing it at a file whose content we know turns that content into the HMAC secret we sign with."
    request_strategy: "Try /dev/null first, then known-content proc files, then /etc/hostname."
    mutation_strategy: "Vary traversal depth and encoding; try absolute paths if relative fails."
    expected_signal: "Forged token with modified claims accepted."
    positive_oracle: "Server-side identity reflects the forged claims."
    negative_evidence:
      - "All kid values rejected or ignored"
      - "kid maps to a fixed allowlist of key names"
    false_positive_rules:
      - "Distinguish from alg=none and signature-not-verified bugs — tampered unsigned token must be rejected first"
      - "Do not read sensitive files; use only known-content, non-sensitive paths"
    followup_experiment: "If traversal fails, test jku/x5u key-URL spoofing (C1-007)."
    regression_test: "Original token with original kid still validates."
    difficulty_estimate: 3

  - id: C1-007
    name: "JWT jku/x5u spoofed key URL with collaborator oracle"
    klass: auth
    requires:
      - jwt_observed
      - owned_https_server
    signals:
      - server_fetches_remote_resources
      - jku_or_x5u_header_accepted
    questions:
      - "Does the verifier fetch the key set from the jku/x5u URL without an allowlist?"
      - "Does the fetch itself (SSRF-style) happen before signature validation?"
    evidence:
      - "Collaborator receives a key-fetch callback when jku/x5u points at it"
      - "Token signed with attacker key accepted after hosting a JWKS"
    followups:
      - C1-005
    test: "Two-stage: (1) set jku (or x5u) to a unique collaborator URL and submit the token unsigned/unchanged; a callback proves the server fetches key material from attacker URLs (SSRF-shaped finding on its own). (2) Generate your own RSA keypair, host a JWKS containing your public key at that URL, sign a forged token with your private key, and submit."
    impact_hint: "JWT forgery plus an SSRF primitive via the key-fetch channel."
    preconditions:
      - "Verifier honors jku/x5u remote key URLs"
      - "You can host HTTPS content at a public URL"
    required_state: "authenticated_low_privilege"
    hypothesis_generator: "If the key URL is not allowlisted, the verifier will fetch attacker-hosted keys, letting us mint tokens it trusts."
    request_strategy: "Stage 1 is a single callback check; stage 2 only if stage 1 fires."
    mutation_strategy: "Try jku first, then x5u; vary between http/https."
    expected_signal: "Stage 1: collaborator hit. Stage 2: forged-claims token accepted."
    positive_oracle: "Collaborator log entry for the unique URL, then forged identity reflected server-side."
    negative_evidence:
      - "No callback — jku/x5u ignored or allowlisted"
      - "Callback occurs but forged token still rejected (e.g., kid must match)"
    false_positive_rules:
      - "The callback alone is the SSRF finding; forgery requires the stage-2 acceptance"
      - "Use unique URLs per attempt to avoid cross-talk"
    followup_experiment: "If fetch happens but forgery fails, inspect what the server expects at the URL (try hosting the original JWKS with your key added)."
    regression_test: "Token with the original jku still validates."
    difficulty_estimate: 4

  - id: C1-008
    name: "OAuth redirect_uri bypass to authorization-code theft"
    klass: auth
    requires:
      - oauth_authorization_endpoint
    signals:
      - redirect_uri_parameter_present
      - weak_validation_error_messages
    questions:
      - "Does redirect_uri validation compare strings instead of origins?"
      - "Can an open-redirect gadget or parser quirk smuggle an attacker host past the check?"
    evidence:
      - "Authorization server issues a code to the attacker-controlled redirect_uri"
    followups:
      - C1-028
      - C1-029
    test: "From the legitimate authorization URL, mutate redirect_uri through the bypass ladder: subdomain (attacker.target.com), path traversal (target.com/../attacker), userinfo (target.com@attacker.com), backslash normalization (https:/\\/attacker.com), query smuggling (attacker.com?target.com), and fragment tricks. For each, check whether the server redirects with a code to the attacker host. Only complete the flow against test accounts you own."
    impact_hint: "Account takeover via stolen authorization code; token theft if implicit flow."
    preconditions:
      - "An OAuth/OIDC authorization endpoint with a redirect_uri parameter"
      - "A test victim account you control for the final exchange"
    required_state: "authenticated_as_test_victim"
    hypothesis_generator: "If redirect_uri is validated by substring or naive parsing, a crafted URI passes the check while the browser delivers the code to the attacker."
    request_strategy: "One mutation per request; stop at the first that yields a code to the attacker host."
    mutation_strategy: "Walk the ladder in order of subtlety; encode/decode variants last."
    expected_signal: "302 to the attacker-controlled URI carrying code=."
    positive_oracle: "Exchanging the stolen code yields tokens for the victim test account."
    negative_evidence:
      - "All mutations rejected with invalid redirect_uri"
      - "Exact-match validation against a registered list"
    false_positive_rules:
      - "A redirect to the attacker host without a code is just an open redirect, not code theft"
      - "Never use a real victim; test accounts only"
    followup_experiment: "If redirect_uri is strict, test for open-redirect gadgets elsewhere on the domain that can bounce the code (C1-028)."
    regression_test: "The legitimate registered redirect_uri still completes the flow."
    difficulty_estimate: 4

  - id: C1-009
    name: "Host-header injection into absolute password-reset links"
    klass: auth
    requires:
      - password_reset_feature
    signals:
      - reset_email_contains_absolute_url
      - application_behind_reverse_proxy
    questions:
      - "Is the reset link built from the Host header rather than a configured base URL?"
      - "Do X-Forwarded-Host or similar headers override Host?"
    evidence:
      - "Reset email (to an address you control) contains the injected host in the link"
    followups:
      - C1-008
    test: "Request a password reset for an address you own, overriding the Host header (and separately X-Forwarded-Host, X-Host, Forwarded) with an attacker domain. Inspect the received email: if the reset link points at your domain, the header is trusted for link generation — the primitive for reset-token theft against real users."
    impact_hint: "Account takeover at scale if chained with a victim clicking the poisoned link."
    preconditions:
      - "Password-reset flow sends a link by email"
      - "You control the receiving mailbox"
    required_state: "unauthenticated"
    hypothesis_generator: "If link generation trusts the Host header, an attacker-supplied host poisons the reset URL and the token leaks to the attacker domain."
    request_strategy: "One header variant per reset request; a few requests total."
    mutation_strategy: "Rotate Host, X-Forwarded-Host, X-Host, Forwarded, and port-suffixed variants."
    expected_signal: "Email link host equals the injected value."
    positive_oracle: "The emailed URL's host is exactly the attacker domain you injected."
    negative_evidence:
      - "All emails carry the canonical domain regardless of headers"
      - "Request rejected when Host mismatches"
    false_positive_rules:
      - "Only the emailed link counts — a reflected Host in an HTML page is not this finding"
      - "Do not trigger resets for addresses you do not own"
    followup_experiment: "Check whether the same header trust affects email-change or invite links."
    regression_test: "Normal reset request yields the canonical domain link."
    difficulty_estimate: 2

  - id: C1-010
    name: "SSTI context fingerprinting: plaintext vs code context"
    klass: injection
    requires:
      - user_input_reflected_in_page
    signals:
      - reflection_of_special_characters
      - math_expression_evaluated_in_response
    questions:
      - "Is the input rendered inside a template expression already (code context) or as plain data (plaintext context)?"
      - "Which engine syntax evaluates — {{ }}, ${ }, <%= %>, #{ }, *{ }?"
    evidence:
      - "7*7 renders as 49 in the response for exactly one engine syntax"
      - "In code context, breaking out with }} yields evaluation of the trailing expression"
    followups:
      - C1-011
      - C1-012
    test: "First send the polyglot probe ${{<%[%'\"]}}%\\ to detect reflection and error behavior. Then send each math probe ({{7*7}}, ${7*7}, <%= 7*7 %>, #{7*7}, *{7*7}): if one renders 49, that is the engine and you are in plaintext context. If none evaluate but the polyglot caused an error or swallowed output, try code-context breakout: append the engine's closing delimiter plus an expression (e.g., }} {{7*7}} or }}hello) and watch whether the trailing part evaluates."
    impact_hint: "Determines exploitability path; SSTI leads to RCE in most engines."
    preconditions:
      - "User input is reflected or stored-then-rendered server-side"
    required_state: "unauthenticated"
    hypothesis_generator: "Plaintext context evaluates injected expressions directly; code context requires closing the existing expression first — the response differential reveals which."
    request_strategy: "A handful of probes per parameter; compare against a benign baseline response."
    mutation_strategy: "Cycle engine syntaxes; then try breakout closers for the syntax that errored."
    expected_signal: "49 rendered, or a template error naming the engine, or swallowed/dropped reflection."
    positive_oracle: "Arithmetic evaluated server-side (49 in output) — never claim on mere reflection of the payload string."
    negative_evidence:
      - "All syntaxes reflected literally with no evaluation and no errors"
      - "Input is HTML-encoded before render (XSS-shaped, not SSTI)"
    false_positive_rules:
      - "Client-side frameworks (Angular/Vue) can evaluate {{ }} in the browser — confirm the 49 came from the server response, not DOM rendering"
      - "Error pages must name a template engine; generic 500s are weak signal"
    followup_experiment: "With the engine known, run filter-bypass ladders (C1-011) and error-based fingerprinting (C1-012)."
    regression_test: "Benign input renders unchanged; no evaluation of plain text."
    difficulty_estimate: 2

  - id: C1-011
    name: "Jinja2 SSTI filter bypass via attr() and bracket notation"
    klass: injection
    requires:
      - jinja_ssti_confirmed
    signals:
      - keywords_like_import_os_blocked
      - underscores_or_dots_filtered
    questions:
      - "Does the filter block literal substrings (os, import, __) rather than the capability?"
      - "Are request.args / request.values reachable to smuggle blocked words via parameters?"
    evidence:
      - "Attribute access achieved without literal dots/underscores (e.g., request|attr('args'))"
      - "Command output or file content returned through the bypass chain"
    followups:
      - C1-012
    test: "When literal keywords are blocked, rebuild them: use the attr filter ({{ request|attr('application') }}), bracket access with hex escapes ({{ request['\\x5f\\x5fclass\\x5f\\x5f'] }}), and parameter smuggling — pass the blocked word as a query param and reference it ({{ request|attr(request.args.c) }} with ?c=__class__), or assemble it with format ({{ request|attr(request.args.f|format(...)) }}). Climb from attribute access to __globals__ to os.popen only in a lab/authorized scope."
    impact_hint: "SSTI filter bypass to RCE."
    preconditions:
      - "Jinja2 (or Twig-like) SSTI confirmed with a keyword/character filter in front"
    required_state: "authenticated_if_required_by_feature"
    hypothesis_generator: "Substring filters can be defeated by constructing the blocked tokens at render time through filters, bracket access, and request-supplied parameters."
    request_strategy: "Escalate gradually: attribute access, then dunder access, then globals — stop at proof of capability."
    mutation_strategy: "Rotate construction tricks (attr, brackets, hex, format, join of getlist args) one at a time."
    expected_signal: "Blocked keywords no longer needed literally; previously rejected expressions now evaluate."
    positive_oracle: "Server-side evaluation of a constructed expression (e.g., config or class introspection output) — not mere reflection."
    negative_evidence:
      - "Sandbox blocks attribute access to dunders regardless of spelling"
      - "All construction attempts produce the same filter error"
    false_positive_rules:
      - "Do not execute OS commands against a live target — introspection output is sufficient proof"
      - "A sandbox escape claim needs the actual capability demonstrated, not just filter evasion on harmless attributes"
    followup_experiment: "Map which objects are reachable (self, cycler, joiner, namespace, request) to pick the shortest RCE path in an authorized lab."
    regression_test: "Direct blocked keyword still blocked; bypass spelling evaluated."
    difficulty_estimate: 4

  - id: C1-012
    name: "SSTI engine fingerprinting from error-message differentials"
    klass: injection
    requires:
      - user_input_reflected_in_page
    signals:
      - template_error_on_polyglot_probe
      - error_names_engine_or_syntax
    questions:
      - "Does invalid template syntax produce an engine-identifying error?"
      - "Does the error leak template paths or context variables?"
    evidence:
      - "Error message naming the engine (Jinja2, Twig, Freemarker, Velocity, Smarty) or showing template source lines"
    followups:
      - C1-010
      - C1-011
    test: "Send the polyglot ${{<%[%'\"]}}%\\ and a few malformed per-engine probes; capture full error responses. An engine-identifying message (or a debug page with template source) both confirms SSTI and names the exact exploitation playbook. Also try documentation-object probes ({{config}}, {{settings.SECRET_KEY}}) which leak context without needing RCE."
    impact_hint: "Turns a blind reflection into a targeted engine-specific exploit."
    preconditions:
      - "Errors are returned to the client (non-production error handling)"
