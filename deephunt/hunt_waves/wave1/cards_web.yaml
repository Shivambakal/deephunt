# DEEPHUNT Wave 1 — Web/API technique cards (internet intel sweep, 2025-2026)
# Generated 2026-09-27 by Hunt Commander Worker 1. Research only; no live probing performed.
# Sources: PortSwigger Research, HackerOne disclosed reports, Bishop Fox, Assetnote-style writeups,
# public CVE analyses, bug-bounty writeups (2025-2026). All wording original; attributions inline.
techniques:
  - id: W1-001
    name: "CL.0 / 0.CL parser-discrepancy request desync"
    klass: web
    requires: ["front-end proxy/CDN/load-balancer in front of an origin", "HTTP/1.1 spoken on the back-end leg", "shared back-end connection pool"]
    signals: ["front-end and back-end disagree on whether a body exists", "one side ignores Content-Length", "static endpoints that accept POST"]
    questions: ["does the front-end honor Content-Length on this route?", "does the back-end treat a CL body as empty (CL.0) or consume it (0.CL)?", "is there an early-response gadget to break the 0.CL deadlock?"]
    evidence: ["James Kettle 'HTTP/1.1 Must Die: the desync endgame' (2025)", "Akamai CVE-2025-32094 ($9,000 bounty)", "T-Mobile non-prod desync ($12,000)", "Cloudflare CDN smuggling report ($7,000)"]
    followups: ["W1-002 Expect-header trick", "W1-003 funky chunks", "early-response gadget hunt (IIS con/aux/nul, static files, redirects)"]
    test: "Raw-socket POST with Content-Length: N where the body contains a smuggled request prefix; then send a normal GET on the same connection and check for queue poisoning or timing differential."
    impact_hint: "Response-queue poisoning, session hijack, credential theft; at CDN layer affects all customers on the edge node."
    preconditions: ["two HTTP processors parse the same bytes differently", "classic CL+TE conflict NOT required — CL.0/0.CL need no TE header at all"]
    required_state: "Unauthenticated. Raw TCP/TLS socket access; ability to send pipelined requests on one connection."
    hypothesis_generator: "For each route, hypothesize FE in {CL, none} x BE in {CL, none}: CL.0 = FE honors CL while BE treats body as empty; 0.CL = FE ignores CL while BE consumes CL bytes from the next request."
    request_strategy: "POST /static-or-dynamic-path with Content-Length: 30 and body 'GET /admin HTTP/1.1\\r\\nFoo: x\\r\\n\\r\\n' padded to length; follow immediately with a benign GET; compare responses and timings."
    mutation_strategy: "Vary Content-Length (0, small, large), method (POST/GET/HEAD), path (static asset vs dynamic), and add an early-response gadget path to resolve 0.CL deadlock."
    expected_signal: "The follow-up GET receives the response meant for the smuggled request, or a timing delay equal to the smuggled request's processing time."
    positive_oracle: "Time-delay differential across repeated trials, or response content from the smuggled path appearing on the victim request's socket."
    negative_evidence: ["both sides consistently reject or consistently honor CL", "connection closes without queuing", "no timing differential over 10 trials"]
    false_positive_rules: ["a single slow response is NOT desync — require a differential", "never run desync probes against shared production connections without explicit scope authorization"]
    followup_experiment: "Escalate a confirmed primitive to response-queue poisoning against a cache-busted canary path you control, then to web-cache poisoning."
    regression_test: "Send CL and TE together and expect rejection; send CL: 0 with a body and expect the body to be ignored identically by both sides."
    difficulty_estimate: 5

  - id: W1-002
    name: "Expect: 100-continue header desync trick"
    klass: web
    requires: ["front-end that special-cases the Expect header", "HTTP/1.1 back-end leg"]
    signals: ["front-end forwards or mishandles Expect: 100-continue", "0.CL-style deadlock on an otherwise clean link"]
    questions: ["does adding 'Expect: 100-continue' change how the front-end frames the body?", "does the back-end see a body the front-end did not forward?"]
    evidence: ["Kettle 2025 desync research", "Akamai CVE-2025-32094 via Expect trick", "T-Mobile $12,000 non-prod finding"]
    followups: ["W1-001 CL.0/0.CL", "W1-004 H2 downgrade variants"]
    test: "Send a request with 'Expect: 100-continue' plus a Content-Length body; observe whether the front-end and back-end disagree on body framing, producing 0.CL."
    impact_hint: "Opens desync on links that previously had none — extends W1-001 to hardened front-ends."
    preconditions: ["front-end parses Expect before deciding body handling", "back-end still honors Content-Length"]
    required_state: "Unauthenticated. Raw socket control."
    hypothesis_generator: "Hypothesize the front-end treats Expect: 100-continue as 'no body will follow' (or delays forwarding) while the back-end consumes CL bytes from subsequent data."
    request_strategy: "POST with headers 'Expect: 100-continue' and 'Content-Length: N', body = smuggled prefix; compare against identical request without the Expect header."
    mutation_strategy: "Vary Expect values (100-continue, garbage), CL sizes, and whether the 100 response is awaited."
    expected_signal: "Only the Expect-bearing variant shows queuing/timing anomalies — a differential that isolates the header as the trigger."
    positive_oracle: "Differential desync signal present with Expect header and absent without it, across repeated trials."
    negative_evidence: ["front-end strips or normalizes Expect before framing", "no differential between Expect and non-Expect variants"]
    false_positive_rules: ["confirm the differential is header-caused, not connection noise", "do not mistake 100-continue round-trip latency for desync"]
    followup_experiment: "Chain with an early-response gadget to convert 0.CL deadlock into weaponizable queue poisoning."
    regression_test: "Expect-bearing request with matching body must produce identical framing decisions on both sides."
    difficulty_estimate: 4

  - id: W1-003
    name: "Funky chunks — chunk-extension parsing discrepancies"
    klass: web
    requires: ["Transfer-Encoding: chunked accepted on the link", "front-end and back-end written in different HTTP stacks (e.g. proxy vs Kestrel)"]
    signals: ["chunk extensions tolerated differently", "lone control characters (\\n, \\r) inside chunk-size lines"]
    questions: ["does the front-end treat '\\n' after ';' as a line terminator?", "does the back-end treat it as part of the chunk extension?", "which side terminates the chunked body first?"]
    evidence: ["Documented as new 2025 smuggling class in public research compendia", "RFC 9112 token rules vs real-world parser leniency"]
    followups: ["W1-001", "W1-004"]
    test: "Send a chunked request whose chunk-size line contains a semicolon followed by a lone \\n; hide a smuggled request inside what one side believes is chunk data."
    impact_hint: "Full request smuggling (queue poisoning, cache poisoning, credential theft) past WAFs keyed on classic CL.TE signatures."
    preconditions: ["TE: chunked honored by at least one side", "parser differential on chunk extensions"]
    required_state: "Unauthenticated. Raw socket; control over exact bytes including lone LF."
    hypothesis_generator: "Hypothesize FE terminates the chunk-size line at lone \\n while BE consumes it as extension text, so BE sees extra pipelined bytes FE never framed."
    request_strategy: "POST with 'Transfer-Encoding: chunked', body '2;\\nxx\\r\\n45\\r\\nGET /admin HTTP/1.1\\r\\nHost: x\\r\\n\\r\\n0\\r\\n\\r\\n'; observe which side parses the inner GET."
    mutation_strategy: "Vary extension content (\\n, \\r, \\0, spaces), chunk sizes, and stack pairs."
    expected_signal: "Back-end processes the hidden GET as a separate pipelined request while the front-end saw one chunked request."
    positive_oracle: "Response to a follow-up request contains output of the smuggled path, or timing shows an extra request was processed."
    negative_evidence: ["both sides reject lone control chars in chunk extensions", "both sides parse extensions identically"]
    false_positive_rules: ["verify the differential is extension-parsing, not generic TE.CL", "rule out WAF normalization of the chunk stream"]
    followup_experiment: "Attempt web-cache poisoning by smuggling a cacheable redirect response."
    regression_test: "Chunked bodies with RFC-valid extensions must be framed identically by both sides."
    difficulty_estimate: 5

  - id: W1-004
    name: "H2-to-H1 downgrade smuggling (H2.CL / H2.TE / CRLF injection)"
    klass: web
    requires: ["front-end terminates HTTP/2", "back-end speaks HTTP/1.1 (downgrade translation)", "attacker can set HTTP/2 pseudo-headers or header values"]
    signals: ["HTTP/2 enabled at edge, HTTP/1.1 at origin", ":path or header values reflected into the downgraded request line", "Transfer-Encoding surviving downgrade"]
    questions: ["does the downgrader strip Transfer-Encoding?", "can \\r\\n be smuggled inside an HTTP/2 header value?", "does :path injection reach the request line?"]
    evidence: ["Kettle 2025 CDN-level desync research (~30M sites estimated exposure)", "PortSwigger request-tunnelling research"]
    followups: ["W1-001", "W1-005 cache poisoning via smuggled redirect"]
    test: "Over HTTP/2, send :path containing '/?x=1 HTTP/1.1\\r\\nTransfer-Encoding: chunked' or a header value with embedded CRLF; check whether the downgraded HTTP/1.1 request contains attacker-injected headers."
    impact_hint: "CDN-edge desync affecting every customer behind the edge node; WAF bypass for all tenants at once."
    preconditions: ["H2→H1 translation layer exists", "translation does not sanitize CRLF or strip TE"]
    required_state: "Unauthenticated. HTTP/2-capable client."
    hypothesis_generator: "Hypothesize the translator copies header values verbatim into the HTTP/1.1 byte stream, so embedded CRLF becomes real header delimiters."
    request_strategy: "HTTP/2 request with header 'Foo: bar\\r\\nTransfer-Encoding: chunked' or :path '/?a=1 HTTP/1.1\\r\\nX: y'; then send a chunked smuggled body."
    mutation_strategy: "Vary injection point (:path, custom headers, pseudo-headers), CRLF forms (\\r\\n, \\n), and TE vs CL framing."
    expected_signal: "Origin logs or responses show the injected header/request as parsed HTTP/1.1 — e.g. a second request is processed."
    positive_oracle: "Downgraded request demonstrably contains attacker-framed headers (verified via timing oracle or reflected parsing behavior)."
    negative_evidence: ["translator strips TE and rejects/sanitizes CRLF in values", "origin sees exactly one request per H2 stream"]
    false_positive_rules: ["HTTP/2 libraries may normalize before sending — verify bytes on the wire", "a 400 from the origin may mean the translator already rejected it"]
    followup_experiment: "Poison the shared CDN cache with a smuggled redirect to an attacker domain."
    regression_test: "Requests with CRLF in H2 header values must be rejected or sanitized at translation."
    difficulty_estimate: 4

  - id: W1-005
    name: "Cookie chaos — __Host- / __Secure- prefix bypass"
    klass: web
    requires: ["application sets __Host- or __Secure- prefixed cookies for security boundaries", "attacker can plant cookies from a subdomain or via cookie-jar injection"]
    signals: ["session or CSRF state split across prefixed and unprefixed cookies", "subdomain cookie-setting capability"]
    questions: ["does the app honor a non-prefixed shadow cookie when the prefixed one is absent?", "can a subdomain plant a __Host- cookie (it should not be able to)?"]
    evidence: ["PortSwigger Research 'Cookie Chaos: bypassing __Host/__Secure cookie prefixes' (Sep 2025)"]
    followups: ["W1-006 cookie sandwich", "session fixation via cookie planting"]
    test: "From a subdomain (or via an injection primitive), attempt to set __Host-session and __Secure-token cookies; then test whether the application accepts attacker-planted values or falls back to unprefixed shadows."
    impact_hint: "Session fixation, CSRF-token override, auth-boundary bypass where prefix trust was load-bearing."
    preconditions: ["cookie prefixes used as a security control", "some cookie-write primitive exists (subdomain, XSS-adjacent, header injection)"]
    required_state: "Varies: subdomain control or any response-header injection."
    hypothesis_generator: "Hypothesize the app checks the prefixed cookie name but a parser differential (browser vs server cookie jar) lets a planted or shadow cookie win."
    request_strategy: "Set-Cookie from subdomain: '__Host-session=attacker'; then request the app with and without the legitimate cookie and compare auth decisions."
    mutation_strategy: "Vary prefix (__Host-, __Secure-), Domain/Path/Secure attributes, and shadow-cookie names."
    expected_signal: "Application accepts the planted prefixed cookie (browser should have rejected it) or silently falls back to an attacker-controlled unprefixed cookie."
    positive_oracle: "Authenticated action performed under attacker-chosen session/CSRF state, confirmed by server-side state change."
    negative_evidence: ["browser refuses to store the planted prefixed cookie", "app strictly requires the prefixed cookie and rejects shadows"]
    false_positive_rules: ["verify in a real browser jar — curl does not enforce prefix rules", "a reflected cookie value is not acceptance"]
    followup_experiment: "Chain into session fixation: plant session id, have victim-equivalent login, hijack."
    regression_test: "Subdomain-planted __Host- cookies must never be stored or honored."
    difficulty_estimate: 3

  - id: W1-006
    name: "Cookie sandwich — HttpOnly cookie theft via jar injection"
    klass: web
    requires: ["HttpOnly session cookie", "attacker can inject a Set-Cookie or cookie-like value (header injection, subdomain, MITM-adjacent)"]
    signals: ["server-side cookie parsing differs from the browser jar", "multiple cookies with the same name accepted"]
    questions: ["when two cookies share a name, which one does the server read — first or last?", "can an attacker sandwich a malicious value around the real HttpOnly cookie?"]
    evidence: ["PortSwigger Research 'Stealing HttpOnly cookies with the cookie sandwich technique' (Jan 2025)"]
    followups: ["W1-005 cookie chaos"]
    test: "Inject a duplicate cookie name (attacker value) alongside the victim's HttpOnly cookie; determine server precedence and whether attacker value can shadow or leak the real one via reflection."
    impact_hint: "HttpOnly bypass — session theft without XSS."
    preconditions: ["server reads cookies with first-wins or last-wins ambiguity", "cookie injection primitive"]
    required_state: "Cookie-write primitive (subdomain/header injection); victim session not required for the probe."
    hypothesis_generator: "Hypothesize the server splits the Cookie header naively and takes the first (or last) duplicate, letting an injected value shadow the real session or leak it into a reflected context."
    request_strategy: "Send 'Cookie: session=ATTACKER; session=REAL' and 'Cookie: session=REAL; session=ATTACKER'; compare auth outcomes and any reflection."
    mutation_strategy: "Vary duplicate order, separators, quoting, and __Host- variants."
    expected_signal: "Server honors the attacker-positioned duplicate, or reflects the real cookie value into the response."
    positive_oracle: "Server-side authenticated state changes under attacker-chosen cookie value, or the HttpOnly value appears in attacker-observable output."
    negative_evidence: ["server rejects duplicate cookie names", "consistent precedence that cannot be influenced"]
    false_positive_rules: ["reflection of your own injected value is not theft — the oracle needs the VICTIM value", "confirm with two distinct test sessions"]
    followup_experiment: "Use a subdomain Set-Cookie to plant the sandwich in a real browser jar, then trigger a victim-equivalent request."
    regression_test: "Duplicate cookie names must be rejected or handled with documented, unexploitable precedence."
    difficulty_estimate: 4

  - id: W1-007
    name: "Phantom $Version cookie WAF bypass"
    klass: web
    requires: ["WAF inspects Cookie header with signature rules", "back-end cookie parser follows RFC 2965 ($Version) semantics loosely"]
    signals: ["WAF blocks payloads in cookies but back-end still parses them", "Cookie header with $Version prefix changes WAF verdict"]
    questions: ["does the WAF's cookie parser understand '$Version=1' prefixes?", "does the back-end skip or reinterpret the $Version segment and still read the payload cookie?"]
    evidence: ["PortSwigger Research 'Bypassing WAFs with the phantom $Version cookie' (Dec 2024)"]
    followups: ["W1-008 origin bypass", "W1-034 unicode overflows"]
    test: "Prefix the Cookie header with '$Version=1' (phantom segment) carrying the attack payload; check whether the WAF lets it through while the back-end still parses the payload cookie."
    impact_hint: "WAF signature bypass for cookie-borne XSS/SQLi — payload reaches the app uninspected."
    preconditions: ["WAF and back-end disagree on RFC 2965 cookie parsing"]
    required_state: "Unauthenticated. Ability to set arbitrary Cookie headers."
    hypothesis_generator: "Hypothesize the WAF splits cookies on ';' but chokes on the '$Version=1' preamble, while the back-end skips it and parses the remaining pairs normally."
    request_strategy: "Baseline: 'Cookie: id=<script>alert(1)</script>' (expect WAF block). Variant: 'Cookie: $Version=1; id=<script>alert(1)</script>' (expect pass-through + app reflection)."
    mutation_strategy: "Vary $Version values, quoting, separators, and payload classes (XSS, SQLi)."
    expected_signal: "WAF-blocked baseline vs WAF-passed phantom variant with identical application-side parsing."
    positive_oracle: "Payload executes/reflects in application output while WAF logs (if visible) show no block for the phantom variant."
    negative_evidence: ["WAF blocks both variants", "back-end fails to parse the cookie after the $Version segment"]
    false_positive_rules: ["confirm the app actually parsed the payload cookie — a 200 with no reflection is not a bypass", "rule out WAF learning-mode/passive mode"]
    followup_experiment: "Escalate to stored payload (profile field, comment) to prove end-to-end impact."
    regression_test: "WAF cookie parser must handle RFC 2965 preamble identically to the back-end."
    difficulty_estimate: 3

  - id: W1-008
    name: "WAF origin bypass via DNS history and subdomain leaks"
    klass: web
    requires: ["site fronted by WAF/CDN", "origin IP reachable directly (stale DNS, mail subdomain, cert transparency, cloud metadata)"]
    signals: ["WAF headers (cf-ray, x-akamai-*) present on the main domain", "subdomains resolving to different IPs", "historical DNS records pre-dating WAF adoption"]
    questions: ["does any subdomain (mail, dev, origin, direct) leak the origin IP?", "does the origin accept requests with the production Host header?", "is origin access restricted at all?"]
    evidence: ["HITCON ZeroDay ZD-2026-00539: Akamai WAF fully bypassed via mail-subdomain DNS leak on ezorder.8way.com.tw (2026)", "public origin-discovery tooling (EvilWAF auto-hunt, Cloudflair, viewdns.info)"]
    followups: ["direct origin attack with forged Host header", "internal-only paths exposed past the WAF"]
    test: "Enumerate subdomains and historical DNS for origin candidates; connect directly to the candidate IP with 'Host: <production domain>' and compare WAF behavior."
    impact_hint: "Complete WAF bypass — all signature/rate-limit protections skipped; internal admin paths (e.g. Exchange OWA) exposed."
    preconditions: ["origin reachable from the internet", "origin does not validate that traffic came through the WAF"]
    required_state: "Unauthenticated. DNS/subdomain enumeration capability."
    hypothesis_generator: "Hypothesize the origin IP is discoverable (stale A record, mail subdomain, cert SAN) and the origin trusts any request bearing the right Host header."
    request_strategy: "1) subdomain + DNS-history sweep for origin candidates. 2) curl --resolve or direct-IP request with forged Host. 3) diff WAF-blocked payload vs direct-origin response."
    mutation_strategy: "Vary origin candidates, Host header values, and SNI."
    expected_signal: "Direct-to-origin request returns the application (200/app content) while the same payload via the WAF domain is blocked."
    positive_oracle: "Attack payload blocked through the WAF succeeds when sent directly to the origin with a forged Host header."
    negative_evidence: ["origin IP not discoverable or firewalled", "origin rejects non-WAF Host/SNI", "origin requires mTLS/client cert from the WAF"]
    false_positive_rules: ["confirm the candidate IP is really the origin (matching TLS cert, app fingerprint) — not a different vhost", "a 200 from a default vhost is not the app"]
    followup_experiment: "Probe origin-only paths (/admin, /owa, internal APIs) that the WAF policy hides."
    regression_test: "Origin must allowlist WAF egress IPs or require a shared secret header."
    difficulty_estimate: 2

  - id: W1-009
    name: "HTTP Anomaly Rank — differential behaviour fingerprinting"
    klass: web
    requires: ["any HTTP endpoint", "ability to send malformed/edge-case requests"]
    signals: ["inconsistent handling of ambiguous requests across routes", "undocumented endpoints reacting differently to malformed input"]
    questions: ["which routes deviate most from baseline HTTP behavior?", "do anomalies cluster on admin/debug/internal paths?"]
    evidence: ["PortSwigger Research 'Introducing HTTP Anomaly Rank' (Nov 2025)", "James Kettle HTTP Terminator autonomous discovery (Aug 2026)"]
    followups: ["feed anomalies into W1-001..W1-004 smuggling probes", "target top-ranked routes for manual review"]
    test: "Send a battery of edge-case requests (odd methods, duplicate headers, weird CL/TE combos, strange paths) to many routes; rank routes by deviation from the baseline response profile."
    impact_hint: "Recon multiplier — surfaces hidden attack surface and parser differentials that manual testing misses."
    preconditions: ["none beyond HTTP access"]
    required_state: "Unauthenticated. High request volume tolerance."
    hypothesis_generator: "Hypothesize that routes with the most anomalous responses to malformed input sit on different stacks or have weaker validation — prime smuggling/SSRF candidates."
    request_strategy: "Baseline: normal GET per route. Probe set: 20-50 malformed variants per route (method case, duplicate CL, TE variants, path tricks). Score deviation (status/body/length/timing deltas)."
    mutation_strategy: "Expand the probe battery per anomaly class; cluster anomalies by route and by stack fingerprint."
    expected_signal: "A ranked list where the top routes show strong, repeatable deviations (e.g. 400 vs 200 flips, body-length jumps)."
    positive_oracle: "Top-ranked route yields a concrete follow-on finding (desync, auth bypass, info leak) when probed manually."
    negative_evidence: ["uniform responses across all routes and probes", "anomalies not repeatable"]
    false_positive_rules: ["rate limiting and WAF blocks look like anomalies — baseline them out", "CDN edge behavior differs from origin; rank per-host"]
    followup_experiment: "Run the smuggling probe battery (W1-001..W1-004) against the top-5 anomalous routes."
    regression_test: "N/A (recon technique) — re-run after infra changes to detect drift."
    difficulty_estimate: 3

  - id: W1-010
    name: "SAML signature-optional authentication bypass"
    klass: auth
    requires: ["SAML SSO login flow", "application-side SAML response parsing"]
    signals: ["SAMLResponse POST to /acs or /saml/callback", "IdP metadata or /saml/metadata endpoint"]
    questions: ["is signature verification actually enforced, or treated as optional?", "are Issuer, Audience, Destination, timestamps validated?", "can the NameID be swapped to victim?"]
    evidence: ["PortSwigger Research 'The Fragile Lock: Novel Bypasses For SAML Authentication' (Dec 2025)", "PortSwigger 'SAML roulette: the hacker always wins' (Mar 2025)", "Bishop Fox CVE-2026-28323: SolarWinds Web Help Desk treated SAML signature verification as optional (Sep 2026)", "Bishop Fox NetScaler CVE-2026-19490 pre-auth SAML bypass (Sep 2026)"]
    followups: ["XML signature wrapping (XSW)", "NameID confusion across tenants"]
    test: "Capture a valid SAMLResponse, strip or corrupt the Signature element, re-POST to the ACS endpoint; then try swapping NameID to a victim identifier."
    impact_hint: "Unauthenticated full account takeover — one forged POST, no credentials."
    preconditions: ["SAML response accepted without mandatory signature check, or signature validated against attacker-supplied key"]
    required_state: "Unauthenticated; needs one valid SAMLResponse sample (own login) or knowledge of the NameID format."
    hypothesis_generator: "Hypothesize the SP parses the assertion and establishes the session from NameID/attributes without cryptographically binding the response to the IdP key."
    request_strategy: "1) strip Signature. 2) self-sign with attacker key. 3) XSW variants (duplicate assertions). 4) NameID swap to administrator."
    mutation_strategy: "Vary signature presence, canonicalization, Issuer/Audience values, and clock skew."
    expected_signal: "Stripped or self-signed response yields an authenticated session."
    positive_oracle: "Session cookie issued for a forged NameID (e.g. administrator) with no valid IdP signature."
    negative_evidence: ["ACS rejects unsigned/modified responses", "signature validated against pinned IdP cert with full condition checks"]
    false_positive_rules: ["your own valid response replayed is not a bypass — the signature must be invalid or absent", "check for one-time-use (InResponseTo) enforcement separately"]
    followup_experiment: "Test cross-tenant NameID confusion and IdP-initiated vs SP-initiated flows."
    regression_test: "Unsigned, self-signed, and XSW-wrapped responses must all be rejected."
    difficulty_estimate: 3

  - id: W1-011
    name: "OIDC ID-token fail-open on unrecognized algorithm"
    klass: auth
    requires: ["OIDC/OAuth login flow issuing JWT ID tokens", "client-side or server-side ID-token validation in a library"]
    signals: ["ID token JWT in callback", "auth library version fingerprintable (Authlib, custom validators)"]
    questions: ["what happens when 'alg' is an unknown value?", "does validation fail closed (reject) or fail open (return true)?", "is the expected alg pinned?"]
    evidence: ["Authlib CVE-2026-28498 (CVSS 8.2): unrecognized alg silently returns True — ID-token integrity bypass", "Authlib CVE-2026-27962 (CVSS 9.1): JWT signature verification bypass", "86M+ monthly Authlib downloads affected"]
    followups: ["W1-012 unsupported-alg fail-open", "alg:none and RS256->HS256 confusion"]
    test: "Take a valid ID token, change header 'alg' to a bogus value (e.g. 'none2', 'RS999'), keep or drop the signature, and submit it; observe whether validation passes."
    impact_hint: "Authentication bypass via forged ID tokens — attacker mints arbitrary identities."
    preconditions: ["validator does not pin the expected algorithm", "unknown-alg path returns success instead of raising"]
    required_state: "Unauthenticated; needs the token endpoint/callback and knowledge of claim names (sub, aud)."
    hypothesis_generator: "Hypothesize the validator switches on 'alg' and has a default branch that returns True, so any unrecognized algorithm string skips signature verification."
    request_strategy: "Forge ID token: header {'alg':'BOGUS','typ':'JWT'}, payload with victim sub and correct aud/iss; send through the login callback or session endpoint."
    mutation_strategy: "Vary alg (unknown strings, empty, null, case variants), signature present/absent/garbage."
    expected_signal: "Forged token accepted; session established for the claimed sub."
    positive_oracle: "Authenticated session as a victim user with a token no legitimate IdP could have signed."
    negative_evidence: ["unknown alg rejected with error", "alg allowlist enforced and pinned"]
    false_positive_rules: ["the aud/iss must match the target — a token for another audience being rejected is correct behavior", "do not confuse with test-mode bypasses"]
    followup_experiment: "Probe the RSA1_5 padding oracle (CVE-2026-28490) via distinguishable error responses on decryption failures."
    regression_test: "Tokens with unknown, missing, or mismatched alg must be rejected."
    difficulty_estimate: 3

