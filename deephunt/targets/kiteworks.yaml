# DEEPHUNT target profile: kiteworks
name: kiteworks
program: YesWeHack kiteworks-public-bug-bounty-program-1 (public; policy read live 2026-09-27)
scope_hosts:
  - ywh-kw-public.bounty.kiteworks.dev
ct_zones:
  - bounty.kiteworks.dev
github_orgs:
  - kiteworks
seed_urls:
  - https://ywh-kw-public.bounty.kiteworks.dev
tech_terms:
  - Kiteworks Core
  - Email Protection Gateway
  - Managed File Transfer
  - Secure Data Forms
  - Apache Airflow
vuln_classes:
  - privilege escalation
  - RCE
  - XSS
  - LDAP injection
  - IDOR
  - SSRF
  - LFI
  - XXE
