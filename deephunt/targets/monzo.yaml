hypothesis_seeds:
  - Multi-tenant banking APIs are IDOR-prone: account/transaction/payment objects on internal-api.monzo.com may be enumerable across customer boundaries — test strictly within owned accounts.
  - OAuth public-vs-confidential client handling may allow a public client to be treated as confidential (or vice versa); the program explicitly invites confidential=true + secret reports.
  - Payment/pot/transfer flows may have business-logic flaws (amount tampering, race on balance checks, recipient confusion).
  - web.monzo.com and verify.monzo.com are lower-attention web surfaces; check auth, session handling, and open redirects.
operator_brief: |
  1. Join the Monzo program in the Intigriti UI and READ THE SCOPE TAB —
     confirm the exact in-scope domains/apps before anything active.
     (monzo.me and P2P/social features are reported out of scope; verify live.)
  2. Use only your own Monzo account. No credentials are provided; test
     transactions are not refunded.
  3. Before reporting any "exposed OAuth secret": query
     GET /oauth2/clients/<id> on internal-api.monzo.com and check
     `confidential` — false means it is intended to be public.
  4. Work the dossier's ranked hypotheses manually at low rate; banking
     target, so keep every test inside your own account boundary.
