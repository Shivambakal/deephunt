# regression_test/difficulty_estimate. 6 cards.

- id: SUBTO-01
  name: Subdomain takeover via dangling CNAME
  klass: cloud
  requires:
  - cloud_asset_inventory
  signals:
  - cname
  - herokuapp
  - s3
  - azureedge
  - github.io
  - cloudfront
  questions:
  - Does the DNS record point at an unclaimed external service?
  - Can the service still be claimed under the program's rules?
  evidence:
    positive:
    - metadata_service_reachable
    - public_resource_exposed
    - overprivileged_role
    negative:
    - imds_restricted
    - resource_private
    - least_privilege_role
  followups:
  - verify_dangling
  - check_claimability
  test: 'Passive: resolve CNAMEs of all subdomains, match against known dead-service
    fingerprints. Claim ONLY with explicit program permission — otherwise report the
    dangling record as-is.

    '
  impact_hint: High.
  preconditions:
  - cloud_asset_inventory
  required_state: []
  hypothesis_generator: 'When signals [''cname'', ''herokuapp'', ''s3'', ''azureedge'']
    are observed, hypothesize: Subdomain takeover via dangling CNAME.'
  request_strategy: control/test differential pair across identities or states
  mutation_strategy: semantic mutation of the key parameter
  expected_signal: metadata_service_reachable; public_resource_exposed; overprivileged_role
  positive_oracle: metadata_service_reachable
  negative_evidence:
  - imds_restricted
  - resource_private
  - least_privilege_role
  false_positive_rules:
  - 'candidate is not a finding: requires evidence contract satisfaction'
  - kill the benign alternative explicitly before promotion
  - an invalid control (owner denied) poisons the comparison — re-baseline
  followup_experiment: verify_dangling; check_claimability
  regression_test: replay control/test pair; expect oracle HELD
  difficulty_estimate: 0.6
