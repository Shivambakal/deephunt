- id: CLD-02
  name: SSRF to cloud instance metadata (IMDS)
  klass: cloud
  requires:
  - cloud_asset_inventory
  signals:
  - 169.254.169.254
  - metadata
  - imds
  - url=
  - fetch
  questions:
  - Can a URL-fetch feature reach 169.254.169.254?
  - Is IMDSv2 (token-required) enforced?
  - What credentials does the metadata expose?
  evidence:
    positive:
    - metadata_reachable
    - imds_v1
    - credentials_exposed
    negative:
    - metadata_blocked
    - imds_v2_enforced
    - no_url_fetch
  followups:
  - test_metadata_paths
  - try_imdsv2_bypass
  - enumerate_roles
  test: 'Via any URL-fetch feature, request http://169.254.169.254/latest/meta-data/.
    Try IMDSv2 token flow. Never exfiltrate real creds — lab/owned infra only.

    '
  impact_hint: Critical — cloud credential theft.
  preconditions:
  - cloud_asset_inventory
  required_state: []
  hypothesis_generator: 'When signals [''169.254.169.254'', ''metadata'', ''imds'',
    ''url=''] are observed, hypothesize: SSRF to cloud instance metadata (IMDS).'
  request_strategy: control/test differential pair across identities or states
