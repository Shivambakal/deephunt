- id: IDOR-03
  name: Cross-tenant object creation via tenant/cluster ID parameter (write-side IDOR)
  klass: authorization
  requires:
  - authenticated_identity
  - object_identifier
  signals:
  - clusterID
  - cluster_id
  - tenant
  - workspace
  - org_id
  - /api/contents
  questions:
  - Who owns the tenant/cluster identifier in this request?
  - Is the identifier validated against the caller's membership?
  - Can a low-priv user CREATE objects under a foreign tenant, not just read?
  evidence:
    positive:
    - object_created_under_foreign_tenant
    - foreign_cluster_writable
    negative:
    - tenant_membership_checked
    - foreign_id_rejected
  followups:
  - compare_identities
  - test_write_side_idor
  - enumerate_tenant_ids
  test: 'With two owned accounts in different tenants/clusters, capture a create request
    (folder, file, notebook) and swap the tenant/cluster identifier to the other account''s.
    Success = object lands in the victim''s scope. Write-side IDOR is rarer and higher-impact
    than read-side. Grounded: HackerOne #3353057 vs SingleStore (Jul 2026) — clusterID
    swap in POST /public/notebooks/api/contents/ created folders in other users''
    clusters.

    '
  impact_hint: High — cross-tenant write = data planting + privilege escalation path.
  preconditions:
  - authenticated_identity
  - object_identifier
  required_state: []
  hypothesis_generator: 'When signals [''clusterID'', ''cluster_id'', ''tenant'',
    ''workspace''] are observed, hypothesize: Cross-tenant object creation via tenant/cluster
    ID parameter (write-side IDOR).'
  request_strategy: control/test differential pair across identities or states
  mutation_strategy: semantic mutation of the key parameter
  expected_signal: object_created_under_foreign_tenant; foreign_cluster_writable
  positive_oracle: object_created_under_foreign_tenant
  negative_evidence:
  - tenant_membership_checked
  - foreign_id_rejected
  false_positive_rules:
  - 'candidate is not a finding: requires evidence contract satisfaction'
  - kill the benign alternative explicitly before promotion
  - an invalid control (owner denied) poisons the comparison — re-baseline
  followup_experiment: compare_identities; test_write_side_idor
  regression_test: replay control/test pair; expect oracle HELD
  difficulty_estimate: 0.6
