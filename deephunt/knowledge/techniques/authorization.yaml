# DEEPHUNT technique cards — authorization domain
# Schema v2 (§26): preconditions/required_state/hypothesis_generator/
# request_strategy/mutation_strategy/expected_signal/positive_oracle/
# negative_evidence/false_positive_rules/followup_experiment/
# regression_test/difficulty_estimate. 7 cards.

- id: IDOR-01
  name: BOLA on numeric/UUID object IDs
  klass: authorization
  requires:
  - authenticated_identity
  - object_identifier
  signals:
  - /{id}
  - asset
  - document
  - user/
  - invoice
  - order
  - api/v
  questions:
  - Does the object ID in the URL decide authorization, or does the server check ownership?
  - What happens with another owned account's ID — 200 with their data, 403, or 404?
  - Is the ID predictable (sequential) or random — and does randomness substitute
    for a check?
  evidence:
    positive:
    - unauthorized_object_access
    - cross_identity_data_leak
    - privilege_differs_by_identity
    negative:
    - explicit_denial
    - identical_behavior_across_identities
    - ownership_checked_server_side
  followups:
  - compare_identities
  - predict_adjacent_ids
  - try_method_override
  test: 'Two owned accounts A/B. A creates object, captures its ID. B requests the
    same ID directly (GET/PUT/DELETE). Compare: 200 with A''s data = broken object-level
    authorization. Also try IDOR via POST body id, X-HTTP-Method override, and .json
    suffix.

    '
  impact_hint: High — cross-account data disclosure, the most paid bounty class.
  preconditions:
  - authenticated_identity
  - object_identifier
  required_state: []
  hypothesis_generator: 'When signals [''/{id}'', ''asset'', ''document'', ''user/'']
    are observed, hypothesize: BOLA on numeric/UUID object IDs.'
  request_strategy: control/test differential pair across identities or states
  mutation_strategy: semantic mutation of the key parameter
  expected_signal: unauthorized_object_access; cross_identity_data_leak; privilege_differs_by_identity
  positive_oracle: unauthorized_object_access
  negative_evidence:
  - explicit_denial
  - identical_behavior_across_identities
  - ownership_checked_server_side
  false_positive_rules:
  - 'candidate is not a finding: requires evidence contract satisfaction'
  - kill the benign alternative explicitly before promotion
  - an invalid control (owner denied) poisons the comparison — re-baseline
  followup_experiment: compare_identities; predict_adjacent_ids
  regression_test: replay control/test pair; expect oracle HELD
  difficulty_estimate: 0.6
- id: IDOR-02
  name: IDOR via parameter pollution / duplicate params
  klass: authorization
  requires:
  - authenticated_identity
  - object_identifier
  signals:
  - '?'
  - id=
  - user_id
  - account
  questions:
  - Who owns this object?
  - Who should access it?
  - Does authorization depend on object ownership or only on login?
  - What changes when a second owned identity requests the same object?
