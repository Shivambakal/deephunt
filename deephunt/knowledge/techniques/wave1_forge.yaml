  - user_id
  - account
  - coupon
  - credit
  - balance
  - refund
  - redeem
  - wallet
  questions:
  - What new testable property does the interaction of IDOR-02 and RACE-01 create that neither parent card describes?
  - What is the precise oracle that proves the COMBINATION held, not just each parent?
  - Which benign alternative explains the same observation, and what control kills it?
  evidence:
    positive:
    - post_revocation_200_with_victim_data; revocation_authz_toctou
    negative:
    - explicit_denial
    - identical_behavior_across_identities
    - ownership_checked_server_side
    - output_encoded
    - input_neutralized
    - defense_at_boundary
  followups:
  - combo_oracle_replication
  - control_pair_baseline
  - alternative_kill
  test: repeat with varied race offsets; confirm single-threaded baseline denies; check audit log for revocation timestamp
    vs response timestamp
  impact_hint: High — cross-account data disclosure through a revocation race.
  preconditions:
  - authenticated_identity
  - object_identifier
  - http_observation
  required_state: []
  hypothesis_generator: If IDOR via parameter pollution / duplicate params exists on objects that support owner-driven revocation
    AND Race on coupon/credit/refund/balance operations is plausible on state-changing endpoints, race the IDOR read against
    the revocation and look for a post-revocation 200.
  request_strategy: 'staged multi-step combo: establish each parent primitive, then execute the fused sequence'
  mutation_strategy: cross-primitive mutation — vary the interaction point, not each parent in isolation
  expected_signal: post_revocation_200_with_victim_data; revocation_authz_toctou
  positive_oracle: 'COMBO-IDOR-RACE-HELD: fire the IDOR probe for victim object O in parallel with O''s legitimate revocation
    (delete, share-revoke, or ownership transfer by the owner). The oracle holds when at least one raced request returns O''s
    data with a 200 AFTER the revocation completed, proving the authz check and the state mutation are not atomic — a TOCTOU
    on the authorization decision itself.'
  negative_evidence:
  - parent_primitives_hold_but_combo_oracle_fails
  - control_pair_diverges
  false_positive_rules:
  - 'candidate is not a finding: requires the COMBINED oracle, not each parent''s oracle separately'
  - kill the benign alternative explicitly before promotion
  - verify parent primitives independently first — a combo built on a failed parent is noise
  followup_experiment: repeat with varied race offsets; confirm single-threaded baseline denies; check audit log for revocation
    timestamp vs response timestamp
  regression_test: replay control/test pair; expect combined oracle HELD
  difficulty_estimate: 1.0
  forged_from:
  - IDOR-02
  - RACE-01
  forge_rule: R-IDOR-RACE
  why_non_obvious: IDOR tests assume the authorization check is evaluated atomically against current state, but revocation
    (delete/share-revoke/ownership transfer) and the read are often separate operations. Racing them exposes a window where
    the authz decision was made against state that no longer exists.
