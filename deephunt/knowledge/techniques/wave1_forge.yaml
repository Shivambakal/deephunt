  name: 'Raced IDOR: IDOR via parameter pollution / duplicate para… against Race on coupon/credit/refund/balance operatio…
    revocation window'
  klass: forged
  requires:
  - authenticated_identity
  - object_identifier
  - http_observation
  signals:
