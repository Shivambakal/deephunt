  required_state: []
  hypothesis_generator: Where OAuth redirect_uri / state confusion leaves redirect_uri validation loose and Open redirect
    on OAuth-whitelisted domain to code/token theft exists on a whitelisted domain, chain them and capture the authorization
    code at the final hop.
  request_strategy: 'staged multi-step combo: establish each parent primitive, then execute the fused sequence'
  mutation_strategy: cross-primitive mutation — vary the interaction point, not each parent in isolation
  expected_signal: code_exfiltrated_via_redirect_chain; victim_session_from_stolen_code
  positive_oracle: 'COMBO-OAUTH-REDIR-HELD: initiate the OAuth flow with redirect_uri set to a whitelisted-but-open-redirect
    page (Open redirect on OAuth-whitelisted domain to code/token theft), chaining it to an attacker URL. The oracle holds
    when the authorization code minted for the victim session is delivered to the attacker-controlled final hop — the code
    leaves the whitelisted domain via the chained redirect, and exchanging it yields a victim session.'
