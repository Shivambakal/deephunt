  test: test redirect chains from sink; check for IMDS-style responses; measure retry timing signature
  impact_hint: Critical — blind SSRF with the event system's credentials.
  preconditions:
  - http_observation
  - request_grammar
  required_state: []
  hypothesis_generator: Where SSRF via URL fetch / webhook / file-import parameters is reachable through callback registration
    and Producer/consumer dependency inference can drive the event lifecycle, stage register-then-trigger and watch the sink
    for internal fetch artifacts.
  request_strategy: 'staged multi-step combo: establish each parent primitive, then execute the fused sequence'
  mutation_strategy: cross-primitive mutation — vary the interaction point, not each parent in isolation
  expected_signal: webhook_fetch_to_sink; internal_metadata_in_callback
  positive_oracle: 'COMBO-SSRF-WEBHOOK-HELD: register a webhook/callback URL pointing at an attacker sink, then drive the
    multi-step sequence (Producer/consumer dependency inference) that fires the event. The oracle holds when the server-side
    fetch arrives at the sink carrying internal-only artifacts (metadata headers, internal source IP, cloud credential responses
    on redirect) OR when retry bursts to the sink prove an internal fetcher with backoff — a server-side request forgery executed
    by the event pipeline, not the request handler.'
  negative_evidence:
  - parent_primitives_hold_but_combo_oracle_fails
  - control_pair_diverges
  false_positive_rules:
  - 'candidate is not a finding: requires the COMBINED oracle, not each parent''s oracle separately'
  - kill the benign alternative explicitly before promotion
  - verify parent primitives independently first — a combo built on a failed parent is noise
  followup_experiment: test redirect chains from sink; check for IMDS-style responses; measure retry timing signature
  regression_test: replay control/test pair; expect combined oracle HELD
  difficulty_estimate: 1.0
  forged_from:
  - SSRF-01
  - SEQ-01
  forge_rule: R-SSRF-WEBHOOK
  why_non_obvious: 'Single-request SSRF tests look for a URL parameter that is fetched immediately. Webhooks invert this:
    the attacker registers a callback URL, then a LATER event triggers the server-side fetch. The fetch happens out-of-band,
    with the event system''s credentials and retry logic — a blind SSRF with built-in retries.'
