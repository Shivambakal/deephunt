  forged_from:
  - OAUTH-02
  - REDIR-02
  forge_rule: R-OAUTH-REDIR
  why_non_obvious: OAuth redirect_uri validation is usually tested in isolation, and open redirects are dismissed as low severity.
    But a redirect_uri that is merely 'on the right domain' combined with an open redirect ON that domain turns a Low into
    account takeover — the code is minted for a 'valid' URI then bounced to the attacker.
