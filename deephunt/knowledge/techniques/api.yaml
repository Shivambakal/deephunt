- id: RATE-01
  name: Missing rate limits enabling enumeration or cost abuse
  klass: rate-limit
  requires:
  - http_observation
  signals:
  - sms
  - email
  - send
  - invite
  - search
  questions:
  - Is the limit per-IP, per-account, or per-endpoint — and which is missing?
  - Do headers (X-Forwarded-For) reset the counter?
  evidence:
    positive:
    - payload_executed
    - input_reaches_sink
    - defense_bypassed
    negative:
    - output_encoded
    - input_neutralized
    - defense_at_boundary
  followups:
  - probe_rate_limits
  - spoof_client_ip
  test: 'Human-paced checks for absent throttles on SMS/email/send endpoints (owned
    account, tiny volumes). Report cost-abuse potential, don''t realize it.

    '
  impact_hint: Medium.
  preconditions:
  - http_observation
  required_state: []
