# DEEPHUNT technique cards — api domain
# Schema v2 (§26): preconditions/required_state/hypothesis_generator/
# request_strategy/mutation_strategy/expected_signal/positive_oracle/
# negative_evidence/false_positive_rules/followup_experiment/
# regression_test/difficulty_estimate. 7 cards.

- id: API-01
  name: Excessive data exposure / mass assignment
  klass: api
  requires:
  - endpoint_inventory
  signals:
  - api/
  - user
  - profile
  - settings
  questions:
  - Is this endpoint documented or shadow?
  - What parameters does it accept beyond the docs?
  - Are limits (rate, size, depth) enforced server-side?
  - Does versioning change the security model?
  evidence:
    positive:
    - undocumented_parameter_honored
    - limit_not_enforced
    - mass_assignment_accepted
    negative:
    - strict_schema_validation
    - limits_enforced
    - unknown_params_rejected
  followups:
  - fuzz_parameters
  - compare_api_versions
  - probe_rate_limits
  test: 'Diff the API response against what the UI shows (owned account) — look for
    emails, hashes, tokens, internal flags. Try mass-assignment: add {"role":"admin","is_verified":true}
    to update calls.

    '
  impact_hint: Medium-High.
  preconditions:
  - endpoint_inventory
  required_state: []
  hypothesis_generator: 'When signals [''api/'', ''user'', ''profile'', ''settings'']
    are observed, hypothesize: Excessive data exposure / mass assignment.'
  request_strategy: control/test differential pair across identities or states
  mutation_strategy: semantic mutation of the key parameter
  expected_signal: undocumented_parameter_honored; limit_not_enforced; mass_assignment_accepted
  positive_oracle: undocumented_parameter_honored
  negative_evidence:
  - strict_schema_validation
  - limits_enforced
  - unknown_params_rejected
  false_positive_rules:
  - 'candidate is not a finding: requires evidence contract satisfaction'
  - kill the benign alternative explicitly before promotion
  - an invalid control (owner denied) poisons the comparison — re-baseline
  followup_experiment: fuzz_parameters; compare_api_versions
  regression_test: replay control/test pair; expect oracle HELD
  difficulty_estimate: 0.6
