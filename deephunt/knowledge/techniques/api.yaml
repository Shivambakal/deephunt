- id: FUZZ-01
  name: LLM-guided fuzz target selection (OSS-Fuzz-Gen pattern)
  klass: fuzzing
  requires:
  - http_observation
  signals:
  - upload
  - parse
  - import
  - convert
  - file
  - image
  - pdf
  questions:
  - Where does untrusted input flow?
  - Is the dangerous sink reachable?
  - Is the defense enforced at the trust boundary?
  - What does the error reveal?
  evidence:
    positive:
    - payload_executed
    - input_reaches_sink
    - defense_bypassed
    negative:
    - output_encoded
    - input_neutralized
    - defense_at_boundary
  followups:
  - trace_data_flow
  - test_parser_differentials
  - check_defense_location
  test: 'For parser endpoints in authorized scope: generate structured malformed inputs
    (truncated, oversized, type-confused) at low rate. Watch for 500s, hangs, or differential
    behavior indicating unhandled paths.

    '
