# DEEPHUNT technique cards — api domain
# Enriched: requires/signals/questions/evidence/followups per card.
# Source of truth for kb.load_techniques(). 6 cards.

- id: API-01
  name: Excessive data exposure / mass assignment
  klass: api
  requires: [endpoint_inventory]
  signals: ["api/", "user", "profile", "settings"]
  questions:
    - "Is this endpoint documented or shadow?"
    - "What parameters does it accept beyond the docs?"
    - "Are limits (rate, size, depth) enforced server-side?"
    - "Does versioning change the security model?"
  evidence:
    positive: [undocumented_parameter_honored, limit_not_enforced, mass_assignment_accepted]
    negative: [strict_schema_validation, limits_enforced, unknown_params_rejected]
  followups: [fuzz_parameters, compare_api_versions, probe_rate_limits]
  test: >
    Diff the API response against what the UI shows (owned account) — look for emails, hashes, tokens, internal flags. Try mass-assignment: add {"role":"admin","is_verified":true} to update calls.
  impact_hint: Medium-High.

- id: API-02
  name: Unauthenticated / unthrottled enumeration endpoints
  klass: api
  requires: [endpoint_inventory]
  signals: ["search", "users", "check", "exists", "lookup", "suggest"]
  questions:
    - "Is this endpoint documented or shadow?"
    - "What parameters does it accept beyond the docs?"
    - "Are limits (rate, size, depth) enforced server-side?"
    - "Does versioning change the security model?"
  evidence:
    positive: [undocumented_parameter_honored, limit_not_enforced, mass_assignment_accepted]
    negative: [strict_schema_validation, limits_enforced, unknown_params_rejected]
  followups: [fuzz_parameters, compare_api_versions, probe_rate_limits]
  test: >
    Test username/email existence oracles without auth, at human pace. Prove with two owned accounts (exists vs not).
  impact_hint: Medium.

- id: RATE-01
  name: Missing rate limits enabling enumeration or cost abuse
  klass: rate-limit
  requires: [http_observation]
  signals: ["sms", "email", "send", "invite", "search"]
  questions:
    - "Is the limit per-IP, per-account, or per-endpoint — and which is missing?"
    - "Do headers (X-Forwarded-For) reset the counter?"
  evidence:
    positive: [payload_executed, input_reaches_sink, defense_bypassed]
    negative: [output_encoded, input_neutralized, defense_at_boundary]
  followups: [probe_rate_limits, spoof_client_ip]
  test: >
    Human-paced checks for absent throttles on SMS/email/send endpoints (owned account, tiny volumes). Report cost-abuse potential, don't realize it.
  impact_hint: Medium.

- id: FUZZ-01
  name: LLM-guided fuzz target selection (OSS-Fuzz-Gen pattern)
  klass: fuzzing
  requires: [http_observation]
  signals: ["upload", "parse", "import", "convert", "file", "image", "pdf"]
  questions:
    - "Where does untrusted input flow?"
    - "Is the dangerous sink reachable?"
    - "Is the defense enforced at the trust boundary?"
    - "What does the error reveal?"
  evidence:
    positive: [payload_executed, input_reaches_sink, defense_bypassed]
    negative: [output_encoded, input_neutralized, defense_at_boundary]
  followups: [trace_data_flow, test_parser_differentials, check_defense_location]
  test: >
    For parser endpoints in authorized scope: generate structured malformed inputs (truncated, oversized, type-confused) at low rate. Watch for 500s, hangs, or differential behavior indicating unhandled paths.
  impact_hint: Medium — crashes hint at memory-safety issues.

- id: RATE-02
  name: Rate-limit bypass via identity rotation
  klass: rate-limit
  requires: [http_observation]
  signals: ["rate", "limit", "429", "throttle", "otp", "login"]
  questions:
    - "Where does untrusted input flow?"
    - "Is the dangerous sink reachable?"
    - "Is the defense enforced at the trust boundary?"
    - "What does the error reveal?"
  evidence:
    positive: [payload_executed, input_reaches_sink, defense_bypassed]
    negative: [output_encoded, input_neutralized, defense_at_boundary]
  followups: [trace_data_flow, test_parser_differentials, check_defense_location]
  test: >
    After hitting 429, rotate IP header (X-Forwarded-For), session, and endpoint casing. If the counter resets, the limit is cosmetic.
  impact_hint: Medium — enables credential stuffing/brute force.

- id: API-03
  name: API version replay (v1 bugs in v2/v3)
  klass: api
  requires: [endpoint_inventory]
  signals: ["api/v2", "api/v3", "/v1/", "version"]
  questions:
    - "Is this endpoint documented or shadow?"
    - "What parameters does it accept beyond the docs?"
    - "Are limits (rate, size, depth) enforced server-side?"
    - "Does versioning change the security model?"
  evidence:
    positive: [undocumented_parameter_honored, limit_not_enforced, mass_assignment_accepted]
    negative: [strict_schema_validation, limits_enforced, unknown_params_rejected]
  followups: [fuzz_parameters, compare_api_versions, probe_rate_limits]
  test: >
    Replay every v1 authz test against newer API versions. Vendors fix instances, not classes — new versions repeat old bugs.
  impact_hint: High.
