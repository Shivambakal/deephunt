- id: API-04
  name: GraphQL-over-WebSocket bypasses HTTP-layer limits
  klass: api
  requires:
  - graphql_endpoint
  - ws_endpoint
  signals:
  - wss://
  - graphql
  - introspection
  - complexity
  questions:
  - Do the complexity/rate limits on /graphql also apply on the WS transport?
  - Is introspection reachable via WS when blocked over HTTP?
  evidence:
    positive:
    - introspection_via_ws_succeeds
    - complexity_bypassed_on_ws
    negative:
    - limits_shared_across_transports
    - ws_introspection_blocked
  followups:
  - test_ws_introspection
  - compare_transport_limits
  test: 'If the app exposes GraphQL over WebSocket (subscriptions), replay the introspection
    query and a complex/deep query over the WS transport with an owned account. Limits
    enforced only on the HTTP transport are a bypass. Grounded: 2025-2026 cheatsheet
    corpus (WS endpoint, no auth key, introspection reachable, complexity limits bypassed).

    '
  impact_hint: Medium-High — defense exists on one transport only.
  preconditions:
  - graphql_endpoint
  - ws_endpoint
  required_state: []
  hypothesis_generator: 'When signals [''wss://'', ''graphql'', ''introspection'',
    ''complexity''] are observed, hypothesize: GraphQL-over-WebSocket bypasses HTTP-layer
    limits.'
  request_strategy: control/test differential pair across identities or states
  mutation_strategy: semantic mutation of the key parameter
  expected_signal: introspection_via_ws_succeeds; complexity_bypassed_on_ws
  positive_oracle: introspection_via_ws_succeeds
  negative_evidence:
  - limits_shared_across_transports
  - ws_introspection_blocked
  false_positive_rules:
  - 'candidate is not a finding: requires evidence contract satisfaction'
  - kill the benign alternative explicitly before promotion
  - an invalid control (owner denied) poisons the comparison — re-baseline
  followup_experiment: test_ws_introspection; compare_transport_limits
  regression_test: replay control/test pair; expect oracle HELD
  difficulty_estimate: 0.6
