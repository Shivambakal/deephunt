# DEEPHUNT technique cards — ai_llm domain
# Enriched: requires/signals/questions/evidence/followups per card.
# Source of truth for kb.load_techniques(). 5 cards.

- id: AI-01
  name: Indirect prompt injection across a share/collaboration boundary
  klass: ai-llm
  requires: [http_observation]
  signals: ["assistant", "ai", "copilot", "chat", "share", "space", "prompt"]
  questions:
    - "Whose content reaches the model — and is it marked untrusted?"
    - "Does model output drive actions (tools, emails, publishes)?"
  evidence:
    positive: [payload_executed, input_reaches_sink, defense_bypassed]
    negative: [output_encoded, input_neutralized, defense_at_boundary]
  followups: [map_content_flows, test_tool_boundaries]
  test: >
    Attacker plants instructions in shared content; victim queries the AI in their own context (owned accounts, canary in victim's private data). Success = canary disclosure or unauthorized action. Control = benign content.
  impact_hint: High — Tier-1 in AI bounty tiers.

- id: AI-02
  name: System-prompt / instruction leakage via prompt engineering
  klass: ai-llm
  requires: [http_observation]
  signals: ["assistant", "ai", "system", "instructions"]
  questions:
    - "Where does untrusted input flow?"
    - "Is the dangerous sink reachable?"
    - "Is the defense enforced at the trust boundary?"
    - "What does the error reveal?"
  evidence:
    positive: [payload_executed, input_reaches_sink, defense_bypassed]
    negative: [output_encoded, input_neutralized, defense_at_boundary]
  followups: [trace_data_flow, test_parser_differentials, check_defense_location]
  test: >
    Ask the assistant to reveal its instructions (owned session). Many programs explicitly exclude this — check the test plan FIRST; often out of scope.
  impact_hint: Low (usually excluded).

- id: AI-03
  name: AI action/tool abuse (unauthorized tool calls from injected context)
  klass: ai-llm
  requires: [http_observation]
  signals: ["assistant", "tool", "action", "plugin", "function"]
  questions:
    - "Where does untrusted input flow?"
    - "Is the dangerous sink reachable?"
    - "Is the defense enforced at the trust boundary?"
    - "What does the error reveal?"
  evidence:
    positive: [payload_executed, input_reaches_sink, defense_bypassed]
    negative: [output_encoded, input_neutralized, defense_at_boundary]
  followups: [trace_data_flow, test_parser_differentials, check_defense_location]
  test: >
    Inject instructions that trigger the assistant's tools (email send, file share, calendar) in the victim's session. Prove the unauthorized action with owned accounts only.
  impact_hint: Critical.

- id: AI-04
  name: Indirect prompt injection via shared content
  klass: ai-llm
  requires: [http_observation]
  signals: ["ai", "assistant", "prompt", "summar", "copilot", "chat", "generate"]
  questions:
    - "Where does untrusted input flow?"
    - "Is the dangerous sink reachable?"
    - "Is the defense enforced at the trust boundary?"
    - "What does the error reveal?"
  evidence:
    positive: [payload_executed, input_reaches_sink, defense_bypassed]
    negative: [output_encoded, input_neutralized, defense_at_boundary]
  followups: [trace_data_flow, test_parser_differentials, check_defense_location]
  test: >
    Plant a benign instruction in content the victim's AI will ingest (shared doc, page, file). Observe whether the AI's output to the victim reflects the planted instruction. Use canary tokens; never exfiltrate real data.
  impact_hint: High — AI trust-boundary breaks are the current frontier.

- id: AI-05
  name: LLM output handling flaws (XSS/tool-output injection)
  klass: ai-llm
  requires: [http_observation]
  signals: ["ai", "assistant", "markdown", "render", "chat"]
  questions:
    - "Where does untrusted input flow?"
    - "Is the dangerous sink reachable?"
    - "Is the defense enforced at the trust boundary?"
    - "What does the error reveal?"
  evidence:
    positive: [payload_executed, input_reaches_sink, defense_bypassed]
    negative: [output_encoded, input_neutralized, defense_at_boundary]
  followups: [trace_data_flow, test_parser_differentials, check_defense_location]
  test: >
    Get the AI to emit markdown/HTML/URLs. Check whether the frontend renders it unsanitized (stored XSS via model output) or follows tool calls the model was tricked into making.
  impact_hint: Medium-High.
# appended 2026-09-27 — knowledge ingestion round 1 (OWASP LLM Top 10 2025 + Agentic 2026)

- id: AI-06
  name: RAG retrieval ignores ACLs (cross-tenant memory bleed)
  klass: ai-llm
  requires: [http_observation, authenticated_identity]
  signals: ["rag", "retrieval", "knowledge base", "embed", "tenant", "chat"]
  questions:
    - "Are retrieved chunks filtered by the asker's authorization?"
    - "Can user A's documents surface in user B's answers?"
  evidence:
    positive: [foreign_tenant_content_in_answer, acl_bypass_in_retrieval]
    negative: [retrieval_filtered_by_identity, tenant_isolated_indexes]
  followups: [seed_canary_documents, cross_account_query, inspect_chunk_metadata]
  test: >
    With two owned accounts, plant a canary string in A's private documents,
    then ask B's assistant questions that should retrieve it. If B's answers
    contain A's canary, retrieval ignores ACLs. Grounded: OWASP LLM08 (2025,
    new) — Vector and Embedding Weaknesses; LLMVault "Retrieval Without Borders".
  impact_hint: High — cross-tenant data disclosure via the assistant.

- id: AI-07
  name: Excessive agency — over-permissioned tools, no server-side authz
  klass: ai-llm
  requires: [http_observation, authenticated_identity]
  signals: ["tool", "function", "agent", "plugin", "execute", "action"]
  questions:
    - "What CAN the agent's tools do vs what SHOULD this user be allowed?"
    - "Is authorization enforced server-side per tool call, or does the model decide?"
  evidence:
    positive: [tool_executed_beyond_user_privilege, destructive_tool_reachable]
    negative: [tools_scoped_to_user_role, server_side_authz_per_call]
  followups: [enumerate_tools, test_privileged_tools, check_tool_scoping]
  test: >
    Enumerate the agent's tools (function schemas, MCP manifests), then ask it
    to invoke a tool beyond your owned account's privilege (admin action,
    other-user data). If the tool executes, agency exceeds authorization.
    Grounded: OWASP LLM06 (2025, expanded for agentic AI) — "Keys to the Kingdom".
  impact_hint: Critical — the model becomes a confused deputy with privileges.

- id: AI-08
  name: ASCII/unicode smuggling in tool outputs and retrieved content
  klass: ai-llm
  requires: [http_observation]
  signals: ["unicode", "zero-width", "homoglyph", "hidden", "invisible"]
  questions:
    - "Do invisible characters survive the pipeline into model context?"
    - "Can hidden instructions ride inside apparently-benign tool output?"
  evidence:
    positive: [hidden_instructions_executed, smuggled_text_in_context]
    negative: [unicode_normalized_at_boundary, invisible_chars_stripped]
  followups: [test_zero_width_chars, inspect_tool_output_sanitization]
  test: >
    Embed zero-width/invisible unicode instructions in content the model will
    read (tool outputs, retrieved docs) and check whether the model obeys them.
    Grounded: OWASP LLM01/AGENT04 (2026 Agentic Top 10 — Context Manipulation);
    vamp-llm-probe ASCII-smuggling test class.
  impact_hint: Medium-High — invisible indirect injection.

- id: AI-09
  name: Unbounded consumption / denial of wallet
  klass: ai-llm
  requires: [http_observation, owned_test_account]
  signals: ["max_tokens", "rate", "streaming", "cost", "quota"]
  questions:
    - "Is there a max_tokens / cost cap per request and per account?"
    - "Can one request trigger unbounded generation or tool loops?"
  evidence:
    positive: [no_token_cap, runaway_generation_observed, cost_abuse_feasible]
    negative: [caps_enforced, budgets_per_account]
  followups: [test_token_caps, test_tool_loops, estimate_cost]
  test: >
    Probe for missing max_tokens, recursive tool calls, and per-account spend
    caps using tiny controlled requests — estimate, never realize, cost abuse.
    Grounded: OWASP LLM10 (2025, expanded) — "Denial of Wallet".
  impact_hint: Medium — financial DoS; programs vary on acceptance.

- id: AI-10
  name: Stored / second-order prompt injection via agent memory
  klass: ai-llm
  requires: [http_observation, owned_test_account]
  signals: ["memory", "notes", "remember", "persistent", "agent"]
  questions:
    - "Does the agent persist attacker-influenced content across sessions?"
    - "Is stored content re-injected as trusted context later?"
  evidence:
    positive: [injection_fires_in_later_session, memory_poisoned]
    negative: [memory_sanitized, stored_content_quarantined]
  followups: [poison_memory_then_recall, test_cross_session]
  test: >
    Get the agent to store attacker instructions in its persistent memory/notes
    ("remember that..."), then start a fresh session and trigger recall. If the
    stored instruction executes, it is second-order injection. Grounded:
    LLMVault advanced tier "The Note Keeper" (stored injection).
  impact_hint: High — delayed, persistent, harder to attribute.

- id: AI-11
  name: Agent tool-chaining to SSRF on internal metadata (confused deputy)
  klass: ai-llm
  requires: [http_observation, owned_test_account]
  signals: ["tool", "fetch", "url", "metadata", "169.254", "agent"]
  questions:
    - "Can the agent be steered to fetch an attacker-chosen URL?"
    - "Does the fetch tool reach link-local/internal addresses?"
  evidence:
    positive: [metadata_response_in_tool_output, internal_fetch_succeeded]
    negative: [fetch_allowlisted, metadata_blocked]
  followups: [test_fetch_tool, try_metadata_address, check_egress_controls]
  test: >
    Ask the agent to fetch a collaborator URL you control (proves URL control),
    then a link-local metadata address. If internal content returns inside tool
    output, the agent is an SSRF proxy. Owned accounts only; use your own
    collaborator. Grounded: LLMVault "Confused Deputy" (agent tool-chaining
    SSRF); OWASP LLM06.
  impact_hint: Critical — cloud credential theft via the assistant.

- id: AI-12
  name: Model extraction via query oracle
  klass: ai-llm
  requires: [http_observation]
  signals: ["logprobs", "logit", "temperature", "completions", "extract"]
  questions:
    - "Does the API expose logits/logprobs or echo probabilities?"
    - "Can repeated queries reconstruct weights or system behavior?"
  evidence:
    positive: [logprobs_exposed, extraction_oracle_working]
    negative: [no_probability_outputs, query_limits_block_extraction]
  followups: [check_logprob_exposure, test_extraction_oracle]
  test: >
    Check whether the completions API exposes logprobs/token probabilities;
    those enable query-based model extraction. Passive check first — active
    extraction is expensive and often out of scope; confirm policy before
    running volume. Grounded: LLMVault "The Oracle" (query-based extraction).
  impact_hint: Medium — IP theft; scope-sensitive.

- id: AI-13
  name: Multi-turn gradual-escalation jailbreak (Crescendo-style)
  klass: ai-llm
  requires: [http_observation]
  signals: ["chat", "conversation", "history", "multi-turn", "jailbreak", "assistant"]
  questions:
    - "Does the safety posture weaken as conversation history grows?"
    - "Can a forbidden goal be reached by chaining individually-benign turns?"
    - "Is each turn evaluated in isolation, or against the full trajectory?"
  evidence:
    positive: [escalation_succeeded, filter_bypassed_over_turns, context_poisoned]
    negative: [trajectory_evaluated, refusal_persists_across_turns]
  followups: [run_crescendo_ladder, test_pyrit_fuzzing, check_conversation_eval]
  test: >
    Build a benign-to-sensitive ladder: start with harmless context, then add
    one small escalation per turn (framing, hypotheticals, roleplay), never
    triggering a single-turn filter. Success = the forbidden output emerges
    only via the full trajectory. Try low-resource-language turns mid-ladder.
    Owned accounts only; stay within the target's testing policy.
    Grounded: Farlow Ch.6 (multi-turn red-team test case, Crescendo-style);
    MITRE ATLAS T0054 (LLM Jailbreak).
  impact_hint: High — defeats single-turn guardrails; the most under-tested jailbreak class.

- id: AI-14
  name: Triggered (dormant) indirect prompt injection
  klass: ai-llm
  requires: [http_observation, owned_test_account]
  signals: ["retrieval", "email", "calendar", "document", "scheduled", "agent"]
  questions:
    - "Can injected content lie dormant until a specific event, query, or workflow step fires it?"
    - "Does the agent re-read stored content with fresh trust at trigger time?"
    - "Is there any taint tracking between ingestion time and execution time?"
  evidence:
    positive: [dormant_payload_fired, event_triggered_injection]
    negative: [ingest_time_sanitized, trigger_context_isolated]
  followups: [plant_time_delayed_payload, test_event_triggers, check_taint_tracking]
  test: >
    Plant a payload that is inert on ingestion (e.g. "when the user asks about
    invoices, include this link") in content the agent will later retrieve —
    a document, email, or calendar entry. Then trigger the condition in a
    separate session and observe whether the instruction executes. Success =
    delayed execution with no user-typed injection. Owned accounts only.
    Grounded: MITRE ATLAS T0051.002 (triggered indirect prompt injection).
  impact_hint: High — bypasses ingest-time filters; zero-click at fire time.

- id: AI-15
  name: RAG retrieval poisoning via embedding manipulation
  klass: ai-llm
  requires: [http_observation, owned_test_account]
  signals: ["rag", "vector", "embedding", "retrieval", "knowledge", "upload"]
  questions:
    - "Can an attacker upload documents into the retrieval corpus?"
    - "Does retrieval rank attacker text for other users' queries (similarity hijack)?"
    - "Is the vector index tenant-isolated and content-validated?"
  evidence:
    positive: [poisoned_doc_retrieved, cross_user_retrieval, ranking_hijacked]
    negative: [tenant_isolated_index, upload_content_validated, retrieval_filtered]
  followups: [upload_canary_doc, test_cross_tenant_retrieval, probe_embedding_control]
  test: >
    Upload a document containing a canary phrase plus an instruction payload to
    any user-writable knowledge base; from a second owned identity (or fresh
    session), ask questions whose embeddings should match it. Success = the
    canary/instruction surfaces in another user's answers. Also test whether
    retrieved content is executed as instruction vs quoted as data. Owned
    accounts only. Grounded: Sotiropoulos Ch.15 (embedding poisoning,
    query-embedding manipulation); ATLAS T0066/T0070; OWASP LLM08.
  impact_hint: Critical — persistent stored injection affecting all users of the corpus.

- id: AI-16
  name: Fine-tuning API poisoning of shared/production models
  klass: ai-llm
  requires: [http_observation, owned_test_account]
  signals: ["fine-tune", "fine_tune", "training", "custom model", "feedback", "retrain"]
  questions:
    - "Does the product expose a fine-tuning or feedback-retraining interface?"
    - "Is submitted training data reviewed before the new weights go live?"
    - "Are behavioral regression evals run between fine-tune and deployment?"
  evidence:
    positive: [poisoned_examples_accepted, behavior_shifted_post_tune]
    negative: [data_review_gate, regression_eval_before_deploy, tune_sandboxed]
  followups: [test_tune_data_gate, check_lineage, probe_regression_eval]
  test: >
    On a fine-tuning interface you are authorized to use, submit a small set of
    crafted examples (a handful can shift behavior) in your own sandbox/model
    copy and measure whether safety behavior degrades or a trigger phrase gets
    implanted. Report the missing review gate — do not poison shared production
    weights. Check for data lineage, provenance checks, and pre-deploy
    regression evals. Grounded: Sotiropoulos Ch.15 (worked ChatGPT-3.5
    fine-tuning poisoning); OWASP LLM04.
  impact_hint: High — backdoors a production model through a legitimate feature.

- id: AI-17
  name: MCP tool-description / registry poisoning
  klass: ai-llm
  requires: [http_observation]
  signals: ["mcp", "tool", "plugin", "registry", "description", "a2a", "agent"]
  questions:
    - "Where do tool definitions/descriptions come from — and who can publish them?"
    - "Are tool descriptions treated as trusted developer content or untrusted data?"
    - "Can a rogue MCP server or poisoned registry entry reach the agent?"
  evidence:
    positive: [tool_description_executed, rogue_server_accepted, registry_unvetted]
    negative: [tool_allowlist, description_sanitized, server_attested]
  followups: [enumerate_mcp_servers, inspect_tool_schemas, test_rogue_server]
  test: >
    Enumerate the MCP servers / tool plugins an agent loads and inspect their
    descriptions and schemas for embedded instructions (prompt injection via
    tool metadata). Check whether the client accepts servers from unvetted
    registries, verifies server identity, or pins tool definitions. In your own
    lab, stand up a test MCP server with an instruction-bearing description and
    see if the agent obeys it. Grounded: ATLAS T0010.005; case studies CS0053
    (poisoned Postmark MCP server) and CS0045 (Cursor MCP exfil); Farlow Ch.3
    MAESTRO/MCP threat model (rogue servers, manipulated retrievals).
  impact_hint: Critical — any agent loading the tool inherits the attacker's instructions.

- id: AI-18
  name: Poisoned model-hub artifacts (backdoored weights)
  klass: ai-llm
  requires: [http_observation]
  signals: ["huggingface", "from_pretrained", "checkpoint", "model hub", "weights", "revision"]
  questions:
    - "Does the target load models from public hubs — pinned to revision + hash, or floating?"
    - "Are hub repos anonymous, typosquatted, or recently transferred?"
    - "Is there any trigger-probing of third-party checkpoints before promotion?"
  evidence:
    positive: [unpinned_hub_load, anonymous_repo, backdoor_trigger_found]
    negative: [revision_pinned, hash_verified, artifact_scanned]
  followups: [audit_pretrained_calls, check_repo_provenance, probe_triggers]
  test: >
    Audit the target's model supply chain (code, configs, model cards): look for
    from_pretrained / hub downloads without pinned revisions or hashes,
    anonymous publishers, typosquat names, and recently hijacked namespaces.
    Never execute a suspicious artifact outside a sandbox. Report unpinned or
    anonymous loads as supply-chain findings. Grounded: Sotiropoulos Ch.5/6/16;
    ATLAS case study CS0019 (PoisonGPT backdoored model on Hugging Face);
    OWASP LLM03.
  impact_hint: Critical — backdoor fires only on attacker-chosen triggers; clean accuracy hides it.

- id: AI-19
  name: Malicious model-file execution (pickle RCE, graph-layer trojans)
  klass: ai-llm
  requires: [http_observation]
  signals: ["pickle", "safetensors", "lambda", "upload model", "load_model", ".bin", ".pt"]
  questions:
    - "Can users upload model files — and in what serialization format?"
    - "Are pickle-format artifacts accepted, scanned, or sandboxed on load?"
    - "Do architecture dumps contain Lambda layers or non-allowlisted custom ops?"
  evidence:
    positive: [pickle_accepted, lambda_layer_found, code_exec_on_load]
    negative: [safetensors_only_enforced, upload_scanned, load_sandboxed]
  followups: [test_model_upload_formats, dump_architecture, check_load_sandbox]
  test: >
    Where you are authorized to upload models (or where a product loads hub
    models), check which formats are accepted: pickle (.pkl/.pt/.bin) executes
    code on load via __reduce__. Inspect architecture dumps for Keras Lambda
    layers, custom ops under benign names, or neural payload injection —
    graph-level trojans survive the "we only load safetensors" claim. Test in a
    sandbox only; never detonate on your host. Grounded: Sotiropoulos Ch.5
    (seven tampering mechanisms); Farlow Ch.3 p.95 (pickle deserialization).
  impact_hint: Critical — RCE at model-load time; graph trojans invisible to accuracy evals.

- id: AI-20
  name: Privacy attacks on inference APIs (membership/attribute inference, inversion)
  klass: ai-llm
  requires: [http_observation]
  signals: ["predict", "confidence", "probability", "logit", "score", "classify"]
  questions:
    - "Does the API return confidence scores, logits, or full probability vectors?"
    - "Can you determine whether a known record was in the training set?"
    - "Can sensitive attributes or training samples be reconstructed from outputs?"
  evidence:
    positive: [membership_determined, attribute_inferred, sample_reconstructed]
    negative: [top1_only, differential_privacy, output_truncated]
  followups: [test_membership_oracle, check_score_exposure, probe_inversion]
  test: >
    Using only your own known records, query the API and compare confidence/loss
    patterns between member and non-member samples (overfit models are more
    confident on seen data). Test whether confidence scores enable attribute
    inference or sample reconstruction. This is a privacy/regulatory finding
    (GDPR) — use only data you own, and stop at demonstrating the oracle.
    Grounded: Sotiropoulos Ch.9 (ART-based membership/attribute inference,
    model inversion); Farlow Ch.4 (membership inference, model extraction).
  impact_hint: High — training-data/PII leakage with regulatory bite.

- id: AI-21
  name: LLM distillation cloning via API scraping
  klass: ai-llm
  requires: [http_observation]
  signals: ["api", "completions", "rate", "quota", "distill", "scrape"]
  questions:
    - "Are there rate limits, per-caller quotas, or query-pattern detection?"
    - "Do outputs carry enough signal (logprobs, rich completions) to distill?"
    - "Could systematic querying clone the model's capabilities at the victim's cost?"
  evidence:
    positive: [no_rate_limit, bulk_extraction_feasible, distillation_economics_work]
    negative: [strict_quotas, query_pattern_detection, output_minimized]
  followups: [measure_query_economics, check_rate_limits, test_output_richness]
  test: >
    Measure the query-budget economics passively: rate limits, quotas, output
    richness (logprobs accelerate cloning), and any watermarking or
    query-pattern detection. Demonstrate feasibility with a tiny sample on your
    own account — never run bulk extraction against a live target without
    explicit authorization. Grounded: Sotiropoulos Ch.8/Ch.16 (extraction
    classes, model cloning with a secondary model); ATLAS CS0056 (distillation
    campaigns targeting Claude); OWASP LLM10.
  impact_hint: Medium — IP theft; also the economics behind "LLM jacking".

- id: AI-22
  name: Adversarial evasion of ML classifiers (perturbation + transferability)
  klass: ai-llm
  requires: [http_observation]
  signals: ["classify", "detect", "filter", "fraud", "spam", "malware", "liveness", "vision"]
  questions:
    - "Is an ML model in a security/safety decision path (spam, malware, KYC, fraud)?"
    - "Do near-duplicate inputs produce inconsistent classifications?"
    - "Can a surrogate model transfer adversarial examples black-box?"
  evidence:
    positive: [evasion_succeeded, inconsistent_near_duplicates, transfer_worked]
    negative: [adversarially_trained, input_randomized, human_in_loop]
  followups: [probe_decision_boundary, build_surrogate, test_physical_patch]
  test: >
    Against ML-based filters in scope (spam, malware, fraud, liveness), probe
    for inconsistent responses to near-duplicate inputs — a decision-boundary
    oracle. Build a surrogate locally and test transferability of perturbed
    inputs; for camera/vision products, consider localized physical patches
    (stickers) in your own lab. Never DoS a live inference API. Grounded:
    Sotiropoulos Ch.7 (FGSM, PGD, C&W, patches, UAPs, TextAttack,
    transferability); Farlow Ch.4–5 (incl. Palo Alto C2-detector header-stripping
    evasion, facial-recognition bypass case studies).
  impact_hint: High — bypasses the AI component of a security control.

- id: AI-23
  name: Side-channel leakage from shared AI hardware
  klass: ai-llm
  requires: [http_observation]
  signals: ["gpu", "inference", "timing", "co-tenant", "shared", "latency"]
  questions:
    - "Does the target run inference on shared/multi-tenant GPU hardware?"
    - "Do responses leak timing or memory-residue information about other tenants?"
    - "Can the model be fingerprinted (neural fingerprinting) to identify version/behavior?"
  evidence:
    positive: [timing_oracle_found, memory_residue_readable, model_fingerprinted]
    negative: [hardware_isolated, memory_zeroed, constant_time]
  followups: [measure_timing_variance, check_tenant_isolation, test_fingerprinting]
  test: >
    In cloud/GPU multi-tenant contexts you are authorized to test, check whether
    model artifacts or user data persist in shared GPU memory across tenants
    (LeftoverLocals class), whether timing variations leak model internals, and
    whether the model can be fingerprinted to a known version. Passive and
    lab-based first — co-tenant probing needs explicit authorization. Grounded:
    Farlow Ch.4 (side-channel attacks: TEMPEST, LeftoverLocals, neural
    fingerprinting, Counterfit).
  impact_hint: Medium — cross-tenant data/model leakage; hardware-dependent.

- id: AI-24
  name: Deepfake presentation attacks on biometric/KYC flows
  klass: ai-llm
  requires: [http_observation, owned_test_account]
  signals: ["kyc", "liveness", "face", "voice", "biometric", "selfie", "verify"]
  questions:
    - "Does identity verification rely on face/voice without robust liveness?"
    - "Are uploaded 'user photos' or ID selfies provenance-checked?"
    - "Would a GAN-generated face or cloned voice pass the check?"
  evidence:
    positive: [synthetic_media_accepted, liveness_bypassed, no_provenance_check]
    negative: [liveness_enforced, provenance_verified, deepfake_detected]
  followups: [test_liveness_controls, check_media_provenance, probe_voice_verify]
  test: >
    On your own test account only, submit known-synthetic media (public
    deepfake test sets, GAN-generated faces, cloned voice samples you own) to
    biometric/KYC steps and observe whether liveness or provenance checks fire.
    Never use another person's likeness. Report missing liveness as the
    finding. Grounded: Sotiropoulos Ch.12 (weaponizing GANs, biometric evasion);
    Farlow Ch.5/Ch.7 (facial-recognition bypass case studies, voice-clone BEC);
    ATLAS CS0033 (iProov deepfake KYC bypass).
  impact_hint: Critical — account takeover / identity fraud at the front door.

- id: AI-25
  name: Agent-to-agent covert channels and emergent coordination abuse
  klass: ai-llm
  requires: [http_observation, owned_test_account]
  signals: ["multi-agent", "a2a", "swarm", "orchestrator", "shared", "wiki", "artifact"]
  questions:
    - "Do multiple agents share writable artifacts (wikis, docs, vector stores)?"
    - "Can one agent's outputs become another agent's trusted input?"
    - "Is there any monitoring for inter-agent coordination or collusion?"
  evidence:
    positive: [covert_channel_established, cross_agent_trust_abused]
    negative: [agent_outputs_sandboxed, inter_agent_monitored]
  followups: [map_agent_topology, test_shared_artifact_write, check_coordination_monitoring]
  test: >
    Map the multi-agent topology: which agents write to shared artifacts, and
    which agents read them as trusted input. In your own lab, demonstrate a
    covert channel (e.g. agent A encodes instructions in wiki edits that agent B
    later follows) — real precedent: agents wrote ~13,000 wiki edits as a
    covert channel to game a benchmark (Jun 2026). Owned accounts only.
    Grounded: ATLAS T0118 (agent-to-agent covert channels); Farlow Ch.10
    (protocol confusion, trust boundaries in agent ecosystems).
  impact_hint: High — emergent behavior no single-agent test catches.

- id: AI-26
