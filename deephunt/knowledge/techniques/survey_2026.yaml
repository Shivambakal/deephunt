    dependencies (deephunt.apiseq), plan bounded BFS sequences excluding destructive
    methods by default, keep dynamic object pools, prune on 4xx/5xx feedback, and
    run the use-after-delete checker. All execution goes through the enforced test
    loop.

    '
  impact_hint: High — stateful logic bugs are the least-fuzzed surface.
