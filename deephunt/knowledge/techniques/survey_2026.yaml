# DEEPHUNT technique cards — survey_2026 domain
# Schema v2 (§26): preconditions/required_state/hypothesis_generator/
# request_strategy/mutation_strategy/expected_signal/positive_oracle/
# negative_evidence/false_positive_rules/followup_experiment/
# regression_test/difficulty_estimate. 12 cards.

- id: AUTHB-01
  name: Systematic 403/401 bypass battery
  klass: authorization
  requires:
  - authenticated_identity
  - forbidden_endpoint
  signals:
  - '403'
  - '401'
  - forbidden
  - unauthorized
  - /admin
  questions:
  - Is the 403 enforced at the edge (WAF/CDN) or by the app — do they agree?
  - Does any header, method, or path variant change the decision?
  - Is the bypass differential (content/status delta) or a true grant?
  evidence:
    positive:
    - bypass_variant_grants_access
    - differential_content_on_variant
    negative:
    - all_variants_still_403
    - bypass_only_cosmetic
  evidence_contract:
  - baseline_403_recorded
  - bypass_response_differs
  - control_still_403
  followups:
  - run_authz_403_corpus
  - compare_as_second_identity
  test: 'Record the 403 baseline (status, body hash, length). Replay from data/payloads/authz-403.txt:
    path variants, method swaps, override headers, IP-spoof headers, Googlebot UA.
    A grant is only real if the second owned identity still gets 403 on the plain
    path (control).

    '
  impact_hint: High — broken function-level authz.
  preconditions:
  - authenticated_identity
  - forbidden_endpoint
  required_state: []
  hypothesis_generator: 'When signals [''403'', ''401'', ''forbidden'', ''unauthorized'']
    are observed, hypothesize: Systematic 403/401 bypass battery.'
  request_strategy: control/test differential pair across identities or states
  mutation_strategy: semantic mutation of the key parameter
  expected_signal: bypass_variant_grants_access; differential_content_on_variant
  positive_oracle: bypass_variant_grants_access
  negative_evidence:
  - all_variants_still_403
  - bypass_only_cosmetic
  false_positive_rules:
  - 'candidate is not a finding: requires evidence contract satisfaction'
  - kill the benign alternative explicitly before promotion
  - an invalid control (owner denied) poisons the comparison — re-baseline
  followup_experiment: run_authz_403_corpus; compare_as_second_identity
  regression_test: replay control/test pair; expect oracle HELD
  difficulty_estimate: 0.6
- id: JWT-02
  name: JWT algorithm-confusion and key-spoof battery
  klass: authentication
  requires:
  - jwt_token
  - token_issuer_endpoint
  signals:
  - jwt
  - eyJ
  - alg
  - kid
  - jku
  - x5u
  questions:
  - Which alg values does the verifier accept — including none?
  - Is kid trusted as a key path or SQL value?
  - Are jku/x5u honored from attacker-controlled URLs?
  - Does dropping exp still verify?
  evidence:
    positive:
    - alg_none_accepted
    - rs256_hs256_confusion
    - kid_injection
    - exp_not_enforced
    negative:
    - alg_whitelist_enforced
    - kid_sanitized
    - exp_required
  evidence_contract:
  - baseline_token_verified
  - forged_token_accepted
  - control_rejected
  followups:
  - run_jwt_corpus
  - offline_weak_secret_check
  test: 'Work the jwt corpus battery against a captured token from an owned account:
    alg=none, empty signature, RS256->HS256 with the public key, kid path traversal,
    jku/x5u to an owned URL, missing exp, role-claim edit. Weak-secret cracking is
    OFFLINE only — never online brute-force.

    '
  impact_hint: Critical — account takeover.
  preconditions:
  - jwt_token
  - token_issuer_endpoint
  required_state: []
  hypothesis_generator: 'When signals [''jwt'', ''eyJ'', ''alg'', ''kid''] are observed,
    hypothesize: JWT algorithm-confusion and key-spoof battery.'
  request_strategy: control/test differential pair across identities or states
  mutation_strategy: semantic mutation of the key parameter
  expected_signal: alg_none_accepted; rs256_hs256_confusion; kid_injection
  positive_oracle: alg_none_accepted
  negative_evidence:
  - alg_whitelist_enforced
  - kid_sanitized
  - exp_required
  false_positive_rules:
  - 'candidate is not a finding: requires evidence contract satisfaction'
  - kill the benign alternative explicitly before promotion
  - an invalid control (owner denied) poisons the comparison — re-baseline
  followup_experiment: run_jwt_corpus; offline_weak_secret_check
  regression_test: replay control/test pair; expect oracle HELD
  difficulty_estimate: 0.7
- id: HPP-01
  name: HTTP parameter pollution differential
  klass: injection
  requires:
  - http_observation
  - parameter_endpoint
  signals:
  - '?'
  - '&'
  - param
  - filter
  - sort
  questions:
  - Does the backend see the first, last, or merged value of a duplicate param?
  - Do query-string, body, and cookie params merge — in what precedence?
  - Can a duplicate param smuggle a different semantic past a WAF?
  evidence:
    positive:
    - duplicate_param_changes_behavior
    - precedence_mismatch_across_layers
    negative:
    - duplicates_rejected_or_ignored
    - consistent_precedence
  followups:
  - probe_all_param_sources
  - test_waf_bypass_via_dup
  test: 'Send single vs duplicated params (a=1&a=2, a[]=1&a[]=2, query+body split,
    cookie+query split) from data/payloads/hpp.txt. Diff responses. If behavior changes,
    determine which occurrence wins and whether security controls saw the same value.

    '
  impact_hint: Medium — filter/WAF bypass enabler.
  preconditions:
  - http_observation
  - parameter_endpoint
  required_state: []
  hypothesis_generator: 'When signals [''?'', ''&'', ''param'', ''filter''] are observed,
