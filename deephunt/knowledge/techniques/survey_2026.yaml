- id: API-06
  name: RESTler-style stateful API sequencing
  klass: api
  requires:
  - openapi_or_observed_grammar
  - authenticated_identity
  signals:
  - openapi
  - swagger
  - crud
  - rest
  questions:
  - Which requests produce IDs that later requests consume?
  - Can a bounded multi-request sequence reach a state a single request cannot?
  - Does deleting an object invalidate dependent operations?
  evidence:
    positive:
    - producer_consumer_chain_works
    - sequence_reaches_new_state
    - use_after_delete_error
    negative:
    - no_dependencies_found
    - sequences_add_nothing
  followups:
  - build_object_pool
  - run_feedback_pruning
