- id: EV-01
  name: Evidence contracts with canary calibration
  klass: methodology
  requires:
  - candidate_finding
  signals:
  - finding
  - evidence
  - confirm
  - validate
  questions:
  - What is the minimum artifact set that makes this finding undeniable?
  - Does the contract still validate a known-good canary and reject a known-bad one?
  - Was the control (negative) case actually run?
  evidence:
    positive:
    - contract_validates
    - canaries_green
    negative:
    - contract_too_lax
    - canary_red
  followups:
  - add_contract_to_card
  - gate_report_on_contract
  test: 'Every technique card may declare evidence_contract: a list of required artifacts
    (deephunt.evidence). A finding is confirmable only when all artifacts are present.
    Calibrate with Canary cases: a known-good evidence set must validate, a known-bad
    set must fail. Unknown technique IDs are rejected — no silent confirmations.

    '
  impact_hint: High — XBOW-pattern deterministic confirmation; kills false positives.
  preconditions:
  - candidate_finding
  required_state: []
  hypothesis_generator: 'When signals [''finding'', ''evidence'', ''confirm'', ''validate'']
    are observed, hypothesize: Evidence contracts with canary calibration.'
  request_strategy: control/test differential pair across identities or states
  mutation_strategy: semantic mutation of the key parameter
