# DEEPHUNT technique cards — graphql domain
# Enriched: requires/signals/questions/evidence/followups per card.
# Source of truth for kb.load_techniques(). 4 cards.

- id: GQL-01
  name: GraphQL introspection + field suggestion abuse
  klass: graphql
  requires: [graphql_endpoint, introspection_or_schema]
  signals: ["graphql", "/gql"]
  questions:
    - "Which fields are protected — and is the check per field?"
    - "What does introspection reveal about hidden types and mutations?"
  evidence:
    positive: [field_level_authz_missing, introspection_exposes_schema, batching_amplifies]
    negative: [per_field_authorization, introspection_disabled, batching_limited]
  followups: [introspect_schema, test_field_as_second_user]
  test: >
    Introspection query; if disabled, try field-suggestion error messages to map the schema. Then test authz per sensitive field with two accounts.
  impact_hint: High.

- id: GQL-04
  name: GraphQL field-level authorization gaps
  klass: graphql
  requires: [graphql_endpoint, introspection_or_schema]
  signals: ["graphql", "/graphql", "query {", "__schema"]
  questions:
    - "Is authorization checked per-field or per-query?"
    - "What does introspection expose?"
    - "Can queries be batched or aliased to amplify?"
    - "Do persisted queries change the rules?"
  evidence:
    positive: [field_level_authz_missing, introspection_exposes_schema, batching_amplifies]
    negative: [per_field_authorization, introspection_disabled, batching_limited]
  followups: [introspect_schema, test_field_as_second_user, try_batching]
  test: >
    Introspect (if enabled), then replay each sensitive field/query as a low-priv owned user. Field-level authz is frequently weaker than object-level.
  impact_hint: High.

- id: GQL-02
  name: GraphQL query batching for brute-force/amplification
  klass: graphql
  requires: [graphql_endpoint, introspection_or_schema]
  signals: ["graphql", "batch", "query", "mutation", "login"]
  questions:
    - "Does the endpoint accept batched queries?"
    - "Can batching bypass rate limits on login/OTP mutations?"
    - "Is there query cost/depth limiting?"
  evidence:
    positive: [batching_accepted, rate_limit_bypassed, no_cost_limit]
    negative: [batching_disabled, per_query_rate_limit, cost_analysis]
  followups: [try_batching, batch_login_attempts, test_depth_limit]
  test: >
    Send batched login/OTP mutations in one request. Measure whether rate limits apply per-batch or per-query. Low volume, owned accounts.
  impact_hint: Medium-High — auth brute-force bypass.

- id: GQL-03
  name: Persisted query / allowlist bypass
  klass: graphql
  requires: [graphql_endpoint]
  signals: ["graphql", "persisted", "apq", "allowlist", "query"]
  questions:
    - "Does a query allowlist/persisted-query mode actually restrict operations?"
    - "Can the hash be bypassed or the allowlist escaped?"
    - "Are dangerous mutations excluded from the allowlist?"
  evidence:
    positive: [allowlist_bypassed, arbitrary_query_accepted, dangerous_mutation_allowed]
    negative: [allowlist_enforced, arbitrary_rejected]
  followups: [try_arbitrary_query, hash_bypass, enumerate_allowed]
  test: >
    If persisted queries are advertised, try sending arbitrary queries and hash-collision variants. Enumerate which operations the allowlist permits.
  impact_hint: Medium — restriction bypass.
