- id: GQL-02
  name: GraphQL query batching for brute-force/amplification
  klass: graphql
  requires:
  - graphql_endpoint
  - introspection_or_schema
  signals:
  - graphql
  - batch
  - query
  - mutation
  - login
  questions:
  - Does the endpoint accept batched queries?
  - Can batching bypass rate limits on login/OTP mutations?
  - Is there query cost/depth limiting?
  evidence:
    positive:
    - batching_accepted
    - rate_limit_bypassed
    - no_cost_limit
    negative:
    - batching_disabled
    - per_query_rate_limit
    - cost_analysis
  followups:
  - try_batching
  - batch_login_attempts
  - test_depth_limit
  test: 'Send batched login/OTP mutations in one request. Measure whether rate limits
    apply per-batch or per-query. Low volume, owned accounts.

    '
  impact_hint: Medium-High — auth brute-force bypass.
