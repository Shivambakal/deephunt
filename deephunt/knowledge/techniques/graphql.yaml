# DEEPHUNT technique cards — graphql domain
# Schema v2 (§26): preconditions/required_state/hypothesis_generator/
# request_strategy/mutation_strategy/expected_signal/positive_oracle/
# negative_evidence/false_positive_rules/followup_experiment/
# regression_test/difficulty_estimate. 6 cards.

- id: GQL-01
  name: GraphQL introspection + field suggestion abuse
  klass: graphql
  requires:
  - graphql_endpoint
  - introspection_or_schema
  signals:
  - graphql
  - /gql
  questions:
  - Which fields are protected — and is the check per field?
  - What does introspection reveal about hidden types and mutations?
  evidence:
    positive:
    - field_level_authz_missing
    - introspection_exposes_schema
    - batching_amplifies
    negative:
    - per_field_authorization
    - introspection_disabled
    - batching_limited
  followups:
  - introspect_schema
  - test_field_as_second_user
  test: 'Introspection query; if disabled, try field-suggestion error messages to
    map the schema. Then test authz per sensitive field with two accounts.

    '
  impact_hint: High.
  preconditions:
  - graphql_endpoint
  - introspection_or_schema
  required_state: []
  hypothesis_generator: 'When signals [''graphql'', ''/gql''] are observed, hypothesize:
    GraphQL introspection + field suggestion abuse.'
  request_strategy: control/test differential pair across identities or states
  mutation_strategy: semantic mutation of the key parameter
  expected_signal: field_level_authz_missing; introspection_exposes_schema; batching_amplifies
  positive_oracle: field_level_authz_missing
  negative_evidence:
  - per_field_authorization
  - introspection_disabled
  - batching_limited
  false_positive_rules:
  - 'candidate is not a finding: requires evidence contract satisfaction'
  - kill the benign alternative explicitly before promotion
  - an invalid control (owner denied) poisons the comparison — re-baseline
  followup_experiment: introspect_schema; test_field_as_second_user
  regression_test: replay control/test pair; expect oracle HELD
  difficulty_estimate: 0.6
