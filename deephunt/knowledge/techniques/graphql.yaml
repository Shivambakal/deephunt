- id: GQL-05
  name: GraphQL subscription cross-user channel hijack
  klass: graphql
  requires:
  - graphql_endpoint
  - authenticated_identity
  signals:
  - subscription
  - channelId
  - messageAdded
  - wss://
  - graphql
  questions:
  - Are subscriptions scoped to the subscriber's identity?
  - What happens when channelId belongs to another user?
  evidence:
    positive:
    - foreign_channel_events_received
    - realtime_pii_leaked
    negative:
    - subscription_scoped_to_caller
    - foreign_channel_rejected
  followups:
  - test_channel_ids
  - check_subscription_authz
  test: 'Open the GraphQL WS subscription with an owned low-priv account and subscribe
    to another owned account''s channel: subscription { messageAdded(channelId: "OTHER_USERS_CHANNEL")
    { content } }. Receiving the other account''s real-time events = broken subscription
    authz. Grounded: 2025-2026 methodology corpus; pairs with WS-05.

    '
  impact_hint: High — real-time interception of another user's private events.
  preconditions:
  - graphql_endpoint
  - authenticated_identity
  required_state: []
  hypothesis_generator: 'When signals [''subscription'', ''channelId'', ''messageAdded'',
    ''wss://''] are observed, hypothesize: GraphQL subscription cross-user channel
    hijack.'
  request_strategy: control/test differential pair across identities or states
  mutation_strategy: semantic mutation of the key parameter
  expected_signal: foreign_channel_events_received; realtime_pii_leaked
  positive_oracle: foreign_channel_events_received
  negative_evidence:
  - subscription_scoped_to_caller
  - foreign_channel_rejected
  false_positive_rules:
  - 'candidate is not a finding: requires evidence contract satisfaction'
  - kill the benign alternative explicitly before promotion
  - an invalid control (owner denied) poisons the comparison — re-baseline
  followup_experiment: test_channel_ids; check_subscription_authz
  regression_test: replay control/test pair; expect oracle HELD
  difficulty_estimate: 0.6
- id: GQL-06
  name: Schema enumeration despite disabled introspection (field suggestions)
  klass: graphql
  requires:
  - graphql_endpoint
  - introspection_or_schema
  signals:
  - Did you mean
  - __schema
  - introspection
  - graphql
  questions:
  - Introspection is off — but do error messages still suggest field names?
  - Can the schema be rebuilt from suggestions + brute force?
  evidence:
    positive:
    - suggestions_leak_field_names
    - schema_reconstructed
    negative:
    - generic_errors_only
    - no_suggestions
  followups:
  - probe_unknown_fields
  - bruteforce_field_names
  - map_mutations
  test: 'Send { unknownFieldXYZ } and read the error. If it replies "Did you mean:
    [realField]?", the schema is enumerable despite disabled introspection — walk
    the alphabet to reconstruct types, then hunt hidden mutations (GQL-04). Grounded:
    2025-2026 GraphQL methodology corpus.

    '
  impact_hint: Medium — unlocks hidden-mutation authz testing.
  preconditions:
  - graphql_endpoint
  - introspection_or_schema
  required_state: []
  hypothesis_generator: 'When signals [''Did you mean'', ''__schema'', ''introspection'',
    ''graphql''] are observed, hypothesize: Schema enumeration despite disabled introspection
    (field suggestions).'
  request_strategy: control/test differential pair across identities or states
  mutation_strategy: semantic mutation of the key parameter
  expected_signal: suggestions_leak_field_names; schema_reconstructed
  positive_oracle: suggestions_leak_field_names
  negative_evidence:
  - generic_errors_only
  - no_suggestions
  false_positive_rules:
  - 'candidate is not a finding: requires evidence contract satisfaction'
  - kill the benign alternative explicitly before promotion
  - an invalid control (owner denied) poisons the comparison — re-baseline
  followup_experiment: probe_unknown_fields; bruteforce_field_names
  regression_test: replay control/test pair; expect oracle HELD
  difficulty_estimate: 0.45
