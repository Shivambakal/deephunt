- id: GQL-03
  name: Persisted query / allowlist bypass
  klass: graphql
  requires:
  - graphql_endpoint
  signals:
  - graphql
  - persisted
  - apq
  - allowlist
  - query
  questions:
  - Does a query allowlist/persisted-query mode actually restrict operations?
  - Can the hash be bypassed or the allowlist escaped?
  - Are dangerous mutations excluded from the allowlist?
  evidence:
    positive:
    - allowlist_bypassed
    - arbitrary_query_accepted
    - dangerous_mutation_allowed
    negative:
    - allowlist_enforced
    - arbitrary_rejected
  followups:
  - try_arbitrary_query
  - hash_bypass
  - enumerate_allowed
  test: 'If persisted queries are advertised, try sending arbitrary queries and hash-collision
    variants. Enumerate which operations the allowlist permits.

    '
  impact_hint: Medium — restriction bypass.
  preconditions:
  - graphql_endpoint
  required_state: []
