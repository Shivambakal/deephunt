# DEEPHUNT technique cards — mobile domain
# Schema v2 (§26): preconditions/required_state/hypothesis_generator/
# request_strategy/mutation_strategy/expected_signal/positive_oracle/
# negative_evidence/false_positive_rules/followup_experiment/
# regression_test/difficulty_estimate. 5 cards.

- id: MOB-01
  name: Deep link / universal link hijacking
  klass: mobile
  requires:
  - mobile_app_surface
  signals:
  - deeplink
  - intent://
  - myapp://
  - applinks
  - universal
  questions:
  - Which deep links carry auth tokens or actions?
  - Can a malicious link trigger a sensitive action without confirmation?
  - Are link parameters validated before use?
  evidence:
    positive:
    - token_in_deeplink
    - action_without_confirm
    - param_not_validated
    negative:
    - no_sensitive_deeplinks
    - confirm_before_action
    - params_validated
  followups:
  - craft_malicious_link
  - test_token_leak
  - fuzz_link_params
  test: 'Enumerate deep link schemes (manifest/assetlinks). Craft links with tokens
    and actions; observe handling. Check for token leakage via referrer.

    '
  impact_hint: Medium-High — account takeover via link.
  preconditions:
  - mobile_app_surface
  required_state: []
  hypothesis_generator: 'When signals [''deeplink'', ''intent://'', ''myapp://'',
    ''applinks''] are observed, hypothesize: Deep link / universal link hijacking.'
  request_strategy: control/test differential pair across identities or states
  mutation_strategy: semantic mutation of the key parameter
  expected_signal: token_in_deeplink; action_without_confirm; param_not_validated
  positive_oracle: token_in_deeplink
  negative_evidence:
  - no_sensitive_deeplinks
  - confirm_before_action
  - params_validated
  false_positive_rules:
  - 'candidate is not a finding: requires evidence contract satisfaction'
  - kill the benign alternative explicitly before promotion
  - an invalid control (owner denied) poisons the comparison — re-baseline
  followup_experiment: craft_malicious_link; test_token_leak
  regression_test: replay control/test pair; expect oracle HELD
  difficulty_estimate: 0.6
- id: MOB-02
