- id: MOB-03
  name: Missing certificate pinning enables MITM
  klass: mobile
  requires:
  - mobile_app_surface
  signals:
  - https
  - certificate
  - pinning
  - tls
  - api
  questions:
  - Does the app pin its API certificate?
  - Can a lab proxy with a custom CA intercept API traffic?
  - Are tokens visible in intercepted traffic?
  evidence:
    positive:
    - no_pinning
    - traffic_interceptable
    - token_visible
    negative:
    - pinning_enforced
    - intercept_blocked
  followups:
  - proxy_with_custom_ca
  - inspect_token_exposure
  test: 'Route owned test device traffic through a lab proxy with installed CA. Observe
    whether API calls succeed and what secrets are visible.

    '
  impact_hint: Medium — network attacker credential theft.
  preconditions:
  - mobile_app_surface
  required_state: []
