- id: HW-01
  name: Speculative-execution info leak (Spectre-class)
  klass: hardware
  requires:
  - hardware_or_firmware_surface
  signals:
  - shared hosting
  - multi-tenant
  - sandbox
  - wasm
  - browser
  questions:
  - What is the trust boundary in silicon?
  - What leaks across it — timing, power, EM?
  - Is the secret ever in the clear?
  - What does the update mechanism trust?
  evidence:
    positive:
    - side_channel_leak
    - secret_in_clear
    - unsigned_update_accepted
    negative:
    - constant_time
    - secret_protected
    - signed_updates_only
  followups:
  - measure_side_channel
  - inspect_update_chain
  - check_debug_interfaces
  test: 'LAB-ONLY: in an owned isolated lab, test cross-boundary speculative reads
    (bounds-check bypass, BTB poisoning). On bounty targets: only report if a tenant-isolation
    boundary demonstrably leaks (e.g. cloud metadata, shared CI runners) — never run
    speculative probes against production.

    '
  impact_hint: Critical in lab; bounty-scope only with demonstrated tenant leak.
  preconditions:
  - hardware_or_firmware_surface
  required_state: []
  hypothesis_generator: 'When signals [''shared hosting'', ''multi-tenant'', ''sandbox'',
    ''wasm''] are observed, hypothesize: Speculative-execution info leak (Spectre-class).'
  request_strategy: control/test differential pair across identities or states
  mutation_strategy: semantic mutation of the key parameter
  expected_signal: side_channel_leak; secret_in_clear; unsigned_update_accepted
  positive_oracle: side_channel_leak
  negative_evidence:
  - constant_time
  - secret_protected
  - signed_updates_only
  false_positive_rules:
  - 'candidate is not a finding: requires evidence contract satisfaction'
  - kill the benign alternative explicitly before promotion
  - an invalid control (owner denied) poisons the comparison — re-baseline
  followup_experiment: measure_side_channel; inspect_update_chain
  regression_test: replay control/test pair; expect oracle HELD
  difficulty_estimate: 0.7
