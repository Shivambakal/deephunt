- id: OAUTH-03
  name: PKCE downgrade — strip code_challenge or accept plain
  klass: authentication
  requires:
  - http_observation
  - owned_test_account
  signals:
  - code_challenge
  - code_verifier
  - pkce
  - authorize
  - oauth
  questions:
  - Does the client send PKCE because the server enforces it, or merely supports it?
  - What happens when code_challenge is removed from the authorize request?
  - Is code_challenge_method=plain accepted?
  evidence:
    positive:
    - code_exchanged_without_challenge
    - plain_method_accepted
    negative:
    - missing_challenge_rejected
    - plain_method_rejected
  followups:
  - test_challenge_strip
  - test_plain_method
  - check_code_binding
  test: 'Run the authorize flow, then replay it with code_challenge and code_challenge_method
    removed. If the flow completes and the code exchanges for tokens, PKCE is decorative.
    Also try code_challenge_method=plain with verifier equal to challenge. Grounded:
    CVE in @cloudflare/workers-oauth-provider <0.0.5 (May 2025) — missing server-side
    check allowed PKCE strip.

    '
  impact_hint: High — enables authorization-code interception attacks.
  preconditions:
  - http_observation
  - owned_test_account
  required_state: []
  hypothesis_generator: 'When signals [''code_challenge'', ''code_verifier'', ''pkce'',
    ''authorize''] are observed, hypothesize: PKCE downgrade — strip code_challenge
    or accept plain.'
  request_strategy: control/test differential pair across identities or states
  mutation_strategy: semantic mutation of the key parameter
  expected_signal: code_exchanged_without_challenge; plain_method_accepted
  positive_oracle: code_exchanged_without_challenge
  negative_evidence:
  - missing_challenge_rejected
  - plain_method_rejected
  false_positive_rules:
  - 'candidate is not a finding: requires evidence contract satisfaction'
  - kill the benign alternative explicitly before promotion
  - an invalid control (owner denied) poisons the comparison — re-baseline
  followup_experiment: test_challenge_strip; test_plain_method
  regression_test: replay control/test pair; expect oracle HELD
  difficulty_estimate: 0.6
- id: OAUTH-04
  name: Authorization code replay race (single-use violation)
  klass: authentication
  requires:
  - http_observation
  - owned_test_account
  signals:
  - code
  - token
  - exchange
  - authorize
  - oauth
  questions:
  - Is the authorization code invalidated after first use?
  - Do parallel exchanges with different code_verifiers all succeed?
  evidence:
    positive:
    - code_exchanged_twice
    - parallel_exchanges_succeed
    negative:
    - second_exchange_rejected
    - code_single_use_enforced
  followups:
  - race_code_exchange
  - check_verifier_binding
  test: 'Capture one authorization code, then fire 2-3 token-exchange requests in
    parallel (Burp "send group in parallel" / Turbo Intruder), each with a different
    code_verifier. If more than one returns tokens, codes are not single-use (RFC
    6749 S4.1.2 violation). Grounded: 2025 finding, $8,500 bounty.

    '
