# regression_test/difficulty_estimate. 13 cards.

- id: AUTHN-01
  name: OTP/rate-limit bypass via response manipulation
  klass: authentication
  requires:
  - owned_test_account
  signals:
  - otp
  - verify
  - 2fa
  - mfa
  - code
  - login
  questions:
  - Is the OTP attempt counter server-side and per-account?
  - Does the verification response leak validity (timing, message, status)?
  evidence:
    positive:
    - credential_check_bypassed
    - unlimited_attempts
    - stale_credential_accepted
    negative:
    - server_side_verification
    - attempts_limited_and_logged
    - single_use_enforced
  followups:
  - probe_rate_limit
  - inspect_error_oracle
  test: 'Try: no rate limit (20 rapid codes), code reuse, leading-zero truncation,
    response-tampering ({"success":true}), and null/empty code. Never brute-force
    real accounts — owned test accounts only, low volume.

    '
  impact_hint: High — account takeover.
  preconditions:
  - owned_test_account
  required_state: []
  hypothesis_generator: 'When signals [''otp'', ''verify'', ''2fa'', ''mfa''] are
    observed, hypothesize: OTP/rate-limit bypass via response manipulation.'
  request_strategy: control/test differential pair across identities or states
  mutation_strategy: semantic mutation of the key parameter
  expected_signal: credential_check_bypassed; unlimited_attempts; stale_credential_accepted
  positive_oracle: credential_check_bypassed
  negative_evidence:
  - server_side_verification
  - attempts_limited_and_logged
  - single_use_enforced
  false_positive_rules:
  - 'candidate is not a finding: requires evidence contract satisfaction'
  - kill the benign alternative explicitly before promotion
  - an invalid control (owner denied) poisons the comparison — re-baseline
  followup_experiment: probe_rate_limit; inspect_error_oracle
  regression_test: replay control/test pair; expect oracle HELD
  difficulty_estimate: 0.6
