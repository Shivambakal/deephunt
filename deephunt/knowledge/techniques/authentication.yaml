  name: 2FA enrollment bypass / recovery-code flaws
  klass: authentication
  requires: [owned_test_account]
  signals: ["2fa", "totp", "recovery", "backup-code"]
  questions:
    - "What proves this identity is who it claims?"
    - "Where is the credential checked — client or server?"
    - "Can the check be skipped, replayed, or desynchronized?"
    - "What happens on the Nth attempt?"
  evidence:
    positive: [credential_check_bypassed, unlimited_attempts, stale_credential_accepted]
    negative: [server_side_verification, attempts_limited_and_logged, single_use_enforced]
