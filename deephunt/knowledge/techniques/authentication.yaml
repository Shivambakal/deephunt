- id: SESS-02
  name: Session/token confusion across subdomains
  klass: session
  requires: [http_observation]
  signals: ["session", "cookie", "domain=", "sso", ".example.com"]
  questions:
    - "Where does untrusted input flow?"
    - "Is the dangerous sink reachable?"
    - "Is the defense enforced at the trust boundary?"
    - "What does the error reveal?"
  evidence:
    positive: [payload_executed, input_reaches_sink, defense_bypassed]
    negative: [output_encoded, input_neutralized, defense_at_boundary]
  followups: [trace_data_flow, test_parser_differentials, check_defense_location]
  test: >
    Check cookie Domain scope: a session cookie scoped to the apex is sent to all subdomains, including less-trusted ones. Test fixation and cross-subdomain replay.
  impact_hint: Medium-High.
