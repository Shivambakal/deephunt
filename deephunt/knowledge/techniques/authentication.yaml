  klass: authentication
  requires: [owned_test_account]
  signals: ["oauth", "authorize", "redirect_uri", "callback", "sso"]
  questions:
    - "What proves this identity is who it claims?"
    - "Where is the credential checked — client or server?"
    - "Can the check be skipped, replayed, or desynchronized?"
    - "What happens on the Nth attempt?"
  evidence:
