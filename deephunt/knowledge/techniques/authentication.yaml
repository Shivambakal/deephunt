- id: AUTHN-03
  name: Password reset email array injection (reset link to attacker)
  klass: authentication
  requires:
  - http_observation
  - owned_test_account
  signals:
  - forgot
  - reset
  - password
  - user[email]
  - application/x-www-form-urlencoded
  questions:
  - Does the reset endpoint accept a different Content-Type than the form sends?
  - Is the email parameter parsed as a scalar or as a list?
  - Where does the reset token actually get delivered?
  evidence:
    positive:
    - reset_link_received_by_attacker
    - token_delivered_to_foreign_address
    negative:
    - single_recipient_enforced
    - array_rejected_with_error
  followups:
  - test_content_type_conversion
  - verify_token_delivery
  - check_token_binding
  test: 'Submit the forgot-password form, intercept, and convert the body to JSON
    (Burp Content-Type Converter). Replace "user[email]":"victim@x" with "user": {"email":
    ["victim@x","attacker@x"]}. If the reset link arrives in the ATTACKER-owned mailbox,
    it is account takeover with zero victim interaction. Grounded: HackerOne #2293343
    vs GitLab, $35,000, critical.

    '
  impact_hint: Critical — full ATO knowing only the victim's email.
  preconditions:
  - http_observation
  - owned_test_account
  required_state: []
  hypothesis_generator: 'When signals [''forgot'', ''reset'', ''password'', ''user[email]'']
