# DEEPHUNT technique cards — business_logic domain
# Enriched: requires/signals/questions/evidence/followups per card.
# Source of truth for kb.load_techniques(). 10 cards.

- id: RACE-01
  name: Race on coupon/credit/refund/balance operations
  klass: race
  requires: [http_observation]
  signals: ["coupon", "credit", "balance", "refund", "redeem", "wallet"]
  questions:
    - "Is there a check-then-act gap?"
    - "What resource is finite — balance, stock, coupon uses?"
    - "Does the backend serialize the critical section?"
  evidence:
    positive: [payload_executed, input_reaches_sink, defense_bypassed]
    negative: [output_encoded, input_neutralized, defense_at_boundary]
  followups: [parallelize_requests, measure_serialization]
  test: >
    Fire 5-10 parallel requests for a redeem/spend action on owned accounts (single short burst, not a flood). Compare final balance vs expected. Predict -> probe -> prove with ledger math.
  impact_hint: High — financial.

- id: RACE-02
  name: TOCTOU on email change / invite / share revocation
  klass: race
  requires: [http_observation]
  signals: ["invite", "share", "revoke", "email", "verify"]
  questions:
    - "Where does untrusted input flow?"
    - "Is the dangerous sink reachable?"
    - "Is the defense enforced at the trust boundary?"
    - "What does the error reveal?"
  evidence:
    positive: [payload_executed, input_reaches_sink, defense_bypassed]
    negative: [output_encoded, input_neutralized, defense_at_boundary]
  followups: [trace_data_flow, test_parser_differentials, check_defense_location]
  test: >
    Overlap the revoke with in-flight requests: mint ticket/link, revoke, then immediately redeem. Also overlap email-change with verification send.
  impact_hint: High.

- id: LOGIC-01
