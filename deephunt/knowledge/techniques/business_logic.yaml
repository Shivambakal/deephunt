- id: RACE-01
  name: Race on coupon/credit/refund/balance operations
  klass: race
  requires:
  - http_observation
  signals:
  - coupon
  - credit
  - balance
  - refund
  - redeem
  - wallet
  questions:
  - Is there a check-then-act gap?
  - What resource is finite — balance, stock, coupon uses?
  - Does the backend serialize the critical section?
  evidence:
    positive:
    - payload_executed
    - input_reaches_sink
    - defense_bypassed
    negative:
    - output_encoded
    - input_neutralized
    - defense_at_boundary
  followups:
  - parallelize_requests
  - measure_serialization
  test: 'Fire 5-10 parallel requests for a redeem/spend action on owned accounts (single
    short burst, not a flood). Compare final balance vs expected. Predict -> probe
    -> prove with ledger math.

    '
  impact_hint: High — financial.
  preconditions:
  - http_observation
  required_state: []
  hypothesis_generator: 'When signals [''coupon'', ''credit'', ''balance'', ''refund'']
    are observed, hypothesize: Race on coupon/credit/refund/balance operations.'
  request_strategy: control/test differential pair across identities or states
  mutation_strategy: semantic mutation of the key parameter
  expected_signal: payload_executed; input_reaches_sink; defense_bypassed
  positive_oracle: payload_executed
  negative_evidence:
  - output_encoded
  - input_neutralized
  - defense_at_boundary
  false_positive_rules:
  - 'candidate is not a finding: requires evidence contract satisfaction'
  - kill the benign alternative explicitly before promotion
  - an invalid control (owner denied) poisons the comparison — re-baseline
  followup_experiment: parallelize_requests; measure_serialization
  regression_test: replay control/test pair; expect oracle HELD
  difficulty_estimate: 0.6
