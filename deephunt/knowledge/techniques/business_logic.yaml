- id: RACE-03
  name: 2FA/OTP verification race (parallel attempts all stay valid)
  klass: race
  requires:
  - http_observation
  - owned_test_account
  signals:
  - 2fa
  - otp
  - verify
  - mfa
  - code
  questions:
  - Does the first verification attempt invalidate the code/challenge?
  - Do parallel verify requests all return success?
  evidence:
    positive:
    - parallel_verifies_all_succeed
    - code_reusable_under_race
    negative:
    - first_verify_consumes_code
    - concurrent_attempts_rejected
  followups:
  - parallel_verify_test
  - check_code_single_use
  test: 'With an owned account at the 2FA step, fire the verify request 3-5x in parallel
    with the same (or different) codes. If all stay valid / multiple succeed, the
    check is not atomic — MFA bypass via race. Grounded: 2025-2026 chain tables (race
    on 2FA cancel/verify links -> MFA bypass).

    '
  impact_hint: High — MFA bypass without touching the victim.
  preconditions:
  - http_observation
  - owned_test_account
  required_state: []
  hypothesis_generator: 'When signals [''2fa'', ''otp'', ''verify'', ''mfa''] are
    observed, hypothesize: 2FA/OTP verification race (parallel attempts all stay valid).'
