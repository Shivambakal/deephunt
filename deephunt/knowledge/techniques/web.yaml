- id: XSS-01
  name: Stored XSS via profile/content fields
  klass: xss
  requires: [http_observation]
  signals: ["comment", "profile", "name", "bio", "ticket", "filename"]
  questions:
    - "Where does the input reflect — HTML, attribute, JS, URL context?"
    - "Is encoding applied at output, and is it the right one for the context?"
  evidence:
    positive: [payload_executed, input_reaches_sink, defense_bypassed]
    negative: [output_encoded, input_neutralized, defense_at_boundary]
  followups: [identify_sink_context, test_encoding_bypass]
  test: >
    Inject inert canary markup (<b> or <img src=x onerror>) into owned-account fields; check where it reflects unescaped (other owned account's view). Prefer canary over alert(); prove with a unique string.
  impact_hint: High.

