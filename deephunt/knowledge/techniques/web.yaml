# DEEPHUNT technique cards — web domain
# Enriched: requires/signals/questions/evidence/followups per card.
# Source of truth for kb.load_techniques(). 23 cards.

- id: JWT-01
  name: JWT alg confusion / none / weak secret
  klass: crypto
  requires: [http_observation]
  signals: ["jwt", "token", "eyJ", "authorization: bearer"]
  questions:
    - "Does the server verify the signature, or trust the alg header?"
    - "What happens with alg=none, or a key-confusion (RS256→HS256)?"
    - "Are claims like role/exp actually enforced?"
  evidence:
    positive: [payload_executed, input_reaches_sink, defense_bypassed]
    negative: [output_encoded, input_neutralized, defense_at_boundary]
  followups: [tamper_alg, confuse_key, edit_claims]
  test: >
    Decode the token (owned account). Try alg=none, RS256->HS256 confusion with the public key, and weak-secret cracking offline against the HMAC. Modify claims (sub, role) and replay.
  impact_hint: High — auth bypass.

- id: SSRF-01
  name: SSRF via URL fetch / webhook / file-import parameters
  klass: ssrf
  requires: [http_observation]
  signals: ["url=", "webhook", "import", "fetch", "avatar", "preview", "callback"]
  questions:
    - "Does the fetcher resolve DNS itself or trust the URL?"
    - "Is 169.254.169.254 / metadata reachable? What about DNS rebinding?"
    - "Which parser validates the URL — and which fetches it?"
  evidence:
    positive: [payload_executed, input_reaches_sink, defense_bypassed]
    negative: [output_encoded, input_neutralized, defense_at_boundary]
  followups: [test_metadata_paths, dns_rebinding, parser_differential]
  test: >
    Point the parameter at an owned collaborator/out-of-band host; confirm DNS/HTTP egress. Then test cloud-metadata (169.254.169.254) ONLY where the program explicitly permits it — many forbid it. Prefer proving with the collaborator + internal 403-vs-timeout oracle.
  impact_hint: Critical.

